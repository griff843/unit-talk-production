# Trace Spine Acceptance
# This workflow provides the required check for branch protection
# on PRs that don't trigger the path-specific autopilot-policy-acceptance workflow.

name: trace-spine-acceptance

on:
  pull_request:
    branches: [main, develop]

jobs:
  # This job provides the trace-spine-acceptance-summary check
  trace-spine-acceptance-summary:
    name: trace-spine-acceptance-summary
    runs-on: ubuntu-latest
    steps:
      - name: Check status
        run: |
          echo "✅ trace-spine-acceptance-summary check passed"
          echo "This workflow provides the required status check for branch protection."
          exit 0
