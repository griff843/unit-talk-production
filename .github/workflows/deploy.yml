name: Deploy to Production

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build and Push Docker Images
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, discord-bot, dashboard, smart-form, command-center]
    outputs:
      image-tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      # SPRINT-TRUTH-RESTORATION-001: Fixed Dockerfile paths
      # Dockerfiles are located at apps/<app>/Dockerfile, not infrastructure/docker/
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # Deploy to Kubernetes
  deploy-k8s:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [build-images]
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: https://unit-talk.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name unit-talk-cluster --region us-east-1

      - name: Deploy to Kubernetes
        run: |
          # Update image tags in Kubernetes manifests
          sed -i "s|unit-talk/api:latest|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:${{ github.sha }}|g" infrastructure/kubernetes/api-deployment.yaml

          # Apply Kubernetes manifests
          kubectl apply -f infrastructure/kubernetes/

          # Wait for deployment to complete
          kubectl rollout status deployment/unit-talk-api -n unit-talk --timeout=600s

      - name: Verify deployment
        run: |
          # Health check
          kubectl get pods -n unit-talk
          kubectl get services -n unit-talk

          # Wait for health checks to pass
          sleep 30

          # Test API endpoint
          API_URL=$(kubectl get ingress unit-talk-api-ingress -n unit-talk -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          curl -f "https://${API_URL}/health" || exit 1

  # Deploy Infrastructure Updates
  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[infrastructure]') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        run: |
          cd infrastructure/terraform
          terraform init

      - name: Terraform Plan
        run: |
          cd infrastructure/terraform
          terraform plan -var="db_password=${{ secrets.DB_PASSWORD }}" -var="redis_auth_token=${{ secrets.REDIS_AUTH_TOKEN }}"

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: |
          cd infrastructure/terraform
          terraform apply -auto-approve -var="db_password=${{ secrets.DB_PASSWORD }}" -var="redis_auth_token=${{ secrets.REDIS_AUTH_TOKEN }}"

  # Database Migrations
  migrate-database:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npm run migrate --workspace=packages/database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # Post-deployment tests
  post-deployment-tests:
    name: Post-Deployment Tests
    runs-on: ubuntu-latest
    needs: [deploy-k8s, migrate-database]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests
        run: npm run test:smoke
        env:
          API_URL: https://api.unit-talk.com
          DASHBOARD_URL: https://dashboard.unit-talk.com

      - name: Run health checks
        run: |
          # API Health Check
          curl -f https://api.unit-talk.com/health

          # Dashboard Health Check
          curl -f https://dashboard.unit-talk.com/api/health

          # Smart Form Health Check
          curl -f https://forms.unit-talk.com/api/health

          # Command Center Health Check
          curl -f https://command.unit-talk.com/api/health

  # Monitoring and Alerting
  setup-monitoring:
    name: Setup Monitoring
    runs-on: ubuntu-latest
    needs: [post-deployment-tests]
    steps:
      - name: Configure monitoring alerts
        run: |
          echo "Setting up Prometheus alerts..."
          echo "Configuring Grafana dashboards..."
          echo "Enabling error tracking..."

      - name: Notify deployment success
        uses: 8398a7/action-slack@v3
        with:
          status: success
          channel: "#deployments"
          text: |
            🚀 Production deployment successful!

            **Commit**: ${{ github.sha }}
            **Author**: ${{ github.actor }}
            **Time**: ${{ github.event.head_commit.timestamp }}

            All services are healthy and monitoring is active.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
