name: Compile Green Validation

on:
  push:
    branches:
      - main
      - "hotfix/**"
      - "fix/**"
    paths:
      - "apps/api/**/*.ts"
      - "apps/api/**/*.tsx"
      - "apps/api/tsconfig.json"
      - "apps/api/package.json"
      - "packages/**/*.ts"
      - "packages/**/*.tsx"
  pull_request:
    paths:
      - "apps/api/**/*.ts"
      - "apps/api/**/*.tsx"
      - "apps/api/tsconfig.json"
      - "apps/api/package.json"
      - "packages/**/*.ts"
      - "packages/**/*.tsx"

env:
  PNPM_VERSION: "10.29.3"

jobs:
  compile-green-api:
    name: TypeScript Compile Check (apps/api)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: TypeScript compile check (apps/api)
        run: pnpm --filter api type-check

      - name: Report success
        if: success()
        run: |
          echo "✅ TypeScript compilation successful for apps/api"
          echo "All type checks passed!"

      - name: Report failure
        if: failure()
        run: |
          echo "❌ TypeScript compilation failed for apps/api"
          echo "Please fix type errors before merging"
          exit 1

  compile-green-command-center:
    name: TypeScript Compile Check (apps/command-center)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: TypeScript compile check (apps/command-center)
        run: pnpm --filter command-center type-check || echo "⚠️ Command Center type check skipped (optional)"
        continue-on-error: true

  compile-green-discord-bot:
    name: TypeScript Compile Check (apps/discord-bot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: TypeScript compile check (apps/discord-bot)
        run: pnpm --filter discord-bot type-check || echo "⚠️ Discord Bot type check skipped (optional)"
        continue-on-error: true

  summary:
    name: Compile Green Summary
    runs-on: ubuntu-latest
    needs: [compile-green-api]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "📊 Compile Green Validation Summary"
          echo "===================================="
          echo ""
          echo "✅ apps/api: ${{ needs.compile-green-api.result }}"
          echo ""

          if [ "${{ needs.compile-green-api.result }}" != "success" ]; then
            echo "❌ Critical compilation failures detected"
            exit 1
          fi

          echo "✅ All critical compile checks passed!"
