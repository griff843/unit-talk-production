                "severity": "critical",
                "source": "deploy-prod",
                "deployment_id": "${{ needs.prechecks.outputs.deployment_id }}",
                "phase": "canary_50"
              },
              "annotations": {
                "summary": "Production deployment rolled back due to SLO guard failures",
                "description": "50% canary phase failed SLO guards and triggered automatic rollback",
                "deployment_id": "${{ needs.prechecks.outputs.deployment_id }}",
                "target_sha": "${{ needs.prechecks.outputs.target_sha }}"
              }
            }]'
          
          exit 1

  full-rollout:
    name: 🚀 Full Production Rollout
    runs-on: ubuntu-latest
    needs: [prechecks, deploy-green, canary-10-percent, canary-50-percent]
    environment: production
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prechecks.outputs.target_sha }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci

      - name: Complete full rollout
        if: ${{ !inputs.dry_run }}
        run: |
          echo "🎯 Completing full rollout to 100%..."
          
          kubectl patch configmap nginx-config --patch '
          data:
            nginx.conf: |
              upstream backend {
                server api-green:3000 weight=100;
              }
          '
          
          kubectl rollout restart deployment/nginx
          kubectl rollout status deployment/nginx --timeout=300s
          
          echo "✅ 100% traffic now routing to green environment"

      - name: Update deployment to completed
        run: |
          node -e "
          const { createClient } = require('@supabase/supabase-js');
          const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_KEY);
          
          async function completeDeployment() {
            const { error } = await supabase.from('deployments')
              .update({
                status: 'completed',
                phase: 'full_rollout',
                completed_at: new Date().toISOString(),
                updated_at: new Date().toISOString()
              })
              .eq('deployment_id', '${{ needs.prechecks.outputs.deployment_id }}');
            
            if (error) {
              console.error('Failed to complete deployment record:', error);
              process.exit(1);
            }
            
            console.log('✅ Deployment completed successfully');
          }
          
          completeDeployment();
          "

      - name: Create release tag and changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🏷️ Creating release tag and updating changelog..."
          
          # Generate release tag
          RELEASE_TAG="v$(date +%Y.%m.%d)-${{ needs.prechecks.outputs.target_sha | slice(0, 8) }}"
          
          # Get commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [[ -n "$LAST_TAG" ]]; then
            COMMIT_RANGE="$LAST_TAG..${{ needs.prechecks.outputs.target_sha }}"
          else
            COMMIT_RANGE="${{ needs.prechecks.outputs.target_sha }}"
          fi
          
          # Generate changelog entry
          echo "## $RELEASE_TAG - $(date +%Y-%m-%d)" > /tmp/changelog.md
          echo "" >> /tmp/changelog.md
          echo "### Changes" >> /tmp/changelog.md
          
          # Get PR titles merged since last tag
          git log --pretty=format:"- %s" --grep="Merge pull request\|feat:\|fix:\|chore:" $COMMIT_RANGE >> /tmp/changelog.md
          
          echo "" >> /tmp/changelog.md
          echo "### Deployment Details" >> /tmp/changelog.md
          echo "- **Target SHA**: ${{ needs.prechecks.outputs.target_sha }}" >> /tmp/changelog.md
          echo "- **Deployment ID**: ${{ needs.prechecks.outputs.deployment_id }}" >> /tmp/changelog.md
          echo "- **Rollout Strategy**: Progressive canary (10% → 50% → 100%)" >> /tmp/changelog.md
          echo "- **Duration**: ${{ inputs.maxStepMinutes }} minutes per phase" >> /tmp/changelog.md
          echo "- **Triggered By**: ${{ github.actor }}" >> /tmp/changelog.md
          echo "" >> /tmp/changelog.md
          
          # Prepend to existing changelog
          if [[ -f CHANGELOG.md ]]; then
            cat /tmp/changelog.md > /tmp/new_changelog.md
            echo "" >> /tmp/new_changelog.md
            cat CHANGELOG.md >> /tmp/new_changelog.md
            mv /tmp/new_changelog.md CHANGELOG.md
          else
            mv /tmp/changelog.md CHANGELOG.md
          fi
          
          # Create annotated tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git tag -a "$RELEASE_TAG" -m "Production release $RELEASE_TAG

          Deployment ID: ${{ needs.prechecks.outputs.deployment_id }}
          Progressive canary rollout completed successfully
          
          Changes since $LAST_TAG:
          $(git log --oneline $COMMIT_RANGE | head -10)
          "
          
          # Push tag
          git push origin "$RELEASE_TAG"
          
          # Commit changelog update
          git add CHANGELOG.md
          git commit -m "chore: update changelog for $RELEASE_TAG"
          git push origin HEAD:main
          
          echo "✅ Release $RELEASE_TAG created and changelog updated"

      - name: Generate rollout transcript
        run: |
          echo "📄 Generating rollout transcript..."
          
          cat > rollout-transcript-${{ needs.prechecks.outputs.deployment_id }}.md << EOF
          # Production Rollout Transcript
          
          **Deployment ID**: ${{ needs.prechecks.outputs.deployment_id }}  
          **Target SHA**: ${{ needs.prechecks.outputs.target_sha }}  
          **Started**: $(date -u)  
          **Duration**: $(( $(date +%s) - $(date -d "${{ needs.prechecks.outputs.deployment_started_at }}" +%s) )) seconds  
          **Triggered By**: ${{ github.actor }}  
          
          ## Rollout Timeline
          
          ### ✅ Prechecks ($(date -u))
          - Required workflows: ✅ All green
          - Rehearsal freshness: ✅ Within 7 days
          - Schema freeze: ✅ No breaking migrations
          
          ### ✅ Green Environment Deploy ($(date -u))
          - Image: ${{ needs.deploy-green.outputs.green_image_tag }}
          - Health: ✅ All services ready
          
          ### ✅ Canary 10% ($(date -u))
          - Duration: ${{ inputs.maxStepMinutes }} minutes
          - SLO Guards: ✅ All passed
          - Traffic Split: 90% blue, 10% green
          
          ### ✅ Canary 50% ($(date -u))
          - Duration: ${{ inputs.maxStepMinutes }} minutes  
          - SLO Guards: ✅ All passed
          - Traffic Split: 50% blue, 50% green
          
          ### ✅ Full Rollout ($(date -u))
          - Traffic Split: 100% green
          - Status: 🎉 Deployment completed successfully
          
          ## SLO Guard Summary
          
          All SLO guards passed throughout the rollout:
          - Feed freshness: < 300 seconds
          - Temporal backlog age: < 300 seconds  
          - Failure burn rate: Not red
          - Canary health: < 90 seconds stale
          
          ## Artifacts
          
          - Workflow Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Target Commit: https://github.com/${{ github.repository }}/commit/${{ needs.prechecks.outputs.target_sha }}
          - Container Images: ${{ needs.deploy-green.outputs.green_image_tag }}
          EOF

      - name: Upload rollout artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rollout-transcript-${{ needs.prechecks.outputs.deployment_id }}
          path: |
            rollout-transcript-${{ needs.prechecks.outputs.deployment_id }}.md
            CHANGELOG.md
          retention-days: 90

      - name: Send success notification
        run: |
          echo "📢 Sending deployment success notifications..."
          
          NOTIFICATION_MESSAGE="🚀 **Production Deployment Successful**

          **Deployment ID**: ${{ needs.prechecks.outputs.deployment_id }}
          **Target SHA**: ${{ needs.prechecks.outputs.target_sha }}
          **Rollout Strategy**: Progressive canary (10% → 50% → 100%)
          **Total Duration**: $(( $(date +%s) - $(date -d "${{ needs.prechecks.outputs.deployment_started_at }}" +%s) )) seconds
          **Triggered By**: ${{ github.actor }}
          
          ✅ All SLO guards passed
          ✅ Zero rollback incidents
          ✅ Release tag created
          ✅ Changelog updated"
          
          # Send to Slack
          if [[ -n "${{ env.SLACK_WEBHOOK_URL }}" ]]; then
            curl -X POST "${{ env.SLACK_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d "{\"text\": \"$NOTIFICATION_MESSAGE\"}"
          fi
          
          # Send to Discord
          if [[ -n "${{ env.DISCORD_WEBHOOK_URL }}" ]]; then
            curl -X POST "${{ env.DISCORD_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d "{\"content\": \"$NOTIFICATION_MESSAGE\"}"
          fi
          
          echo "✅ Deployment completed successfully!"