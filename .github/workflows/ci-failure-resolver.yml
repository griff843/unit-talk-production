name: CI Failure Resolver

# Phase A: Classification + Safe Autofix + Issue Creation
# Phase C: Auto-Revert PR Generation (feature-flagged)
# Phase D: Autopilot Freeze Integration (feature-flagged)
# NO auto-merge, NO branch protection changes
# See: docs/ops/AUTO_RESOLUTION_POLICY.md

on:
  workflow_run:
    workflows:
      - "CI Pipeline"
      - "Compile Green Gate"
      - "Charter Guards"
      - "Schema Drift Check"
      - "E2E CI"
      - "Playwright Proof Pack"
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

env:
  NODE_VERSION: "18"
  EVIDENCE_DIR: out/ci

jobs:
  # ==========================================================================
  # Job 1: Collect Context and Classify Failure
  # ==========================================================================
  collect-and-classify:
    name: Collect Context & Classify
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    outputs:
      failure_class: ${{ steps.classify.outputs.failure_class }}
      severity: ${{ steps.classify.outputs.severity }}
      is_safe_autofix: ${{ steps.classify.outputs.is_safe_autofix }}
      pr_number: ${{ steps.context.outputs.pr_number }}
      branch_name: ${{ steps.context.outputs.branch_name }}
      is_protected_branch: ${{ steps.context.outputs.is_protected_branch }}
      run_url: ${{ steps.context.outputs.run_url }}
      workflow_name: ${{ steps.context.outputs.workflow_name }}
      commit_sha: ${{ steps.context.outputs.commit_sha }}
      failed_jobs: ${{ steps.context.outputs.failed_jobs }}
      error_summary: ${{ steps.classify.outputs.error_summary }}
      evidence_file: ${{ steps.evidence.outputs.evidence_file }}
      auto_revert_enabled: ${{ steps.flags.outputs.auto_revert_enabled }}
      autopilot_freeze_enabled: ${{ steps.flags.outputs.autopilot_freeze_enabled }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check autopilot freeze state
        id: freeze-check
        run: |
          if [ -f "runtime_config/autopilot_state.json" ]; then
            FROZEN=$(jq -r '.frozen' runtime_config/autopilot_state.json)
            if [ "$FROZEN" = "true" ]; then
              SCOPE=$(jq -r '.scope' runtime_config/autopilot_state.json)
              REASON=$(jq -r '.reason' runtime_config/autopilot_state.json)
              echo "::warning::Autopilot frozen (scope: $SCOPE). Reason: $REASON"
              echo "frozen=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "frozen=false" >> $GITHUB_OUTPUT

      - name: Check feature flags
        id: flags
        run: |
          if [ -f "runtime_config/ci_automation.json" ]; then
            CLASSIFICATION_ENABLED=$(jq -r '.features.FAILURE_CLASSIFICATION_ENABLED' runtime_config/ci_automation.json)
            AUTOFIX_ENABLED=$(jq -r '.features.AUTO_FIX_PR_ENABLED' runtime_config/ci_automation.json)
            AUTO_REVERT_ENABLED=$(jq -r '.features.AUTO_REVERT_ENABLED' runtime_config/ci_automation.json)
            AUTOPILOT_FREEZE_ENABLED=$(jq -r '.features.AUTOPILOT_FREEZE_ENABLED' runtime_config/ci_automation.json)
            echo "classification_enabled=$CLASSIFICATION_ENABLED" >> $GITHUB_OUTPUT
            echo "autofix_enabled=$AUTOFIX_ENABLED" >> $GITHUB_OUTPUT
            echo "auto_revert_enabled=$AUTO_REVERT_ENABLED" >> $GITHUB_OUTPUT
            echo "autopilot_freeze_enabled=$AUTOPILOT_FREEZE_ENABLED" >> $GITHUB_OUTPUT
          else
            echo "classification_enabled=true" >> $GITHUB_OUTPUT
            echo "autofix_enabled=true" >> $GITHUB_OUTPUT
            echo "auto_revert_enabled=false" >> $GITHUB_OUTPUT
            echo "autopilot_freeze_enabled=false" >> $GITHUB_OUTPUT
          fi

      - name: Collect workflow context
        id: context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Basic context from event
          WORKFLOW_NAME="${{ github.event.workflow_run.name }}"
          RUN_ID="${{ github.event.workflow_run.id }}"
          RUN_URL="${{ github.event.workflow_run.html_url }}"
          COMMIT_SHA="${{ github.event.workflow_run.head_sha }}"
          BRANCH="${{ github.event.workflow_run.head_branch }}"

          echo "workflow_name=$WORKFLOW_NAME" >> $GITHUB_OUTPUT
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "run_url=$RUN_URL" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "branch_name=$BRANCH" >> $GITHUB_OUTPUT

          # Check if this is a protected branch (main or release/*)
          IS_PROTECTED="false"
          if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "master" ] || [[ "$BRANCH" == release/* ]]; then
            IS_PROTECTED="true"
          fi
          echo "is_protected_branch=$IS_PROTECTED" >> $GITHUB_OUTPUT

          # Try to find associated PR
          PR_NUMBER=""
          if [ -n "$BRANCH" ] && [ "$BRANCH" != "main" ]; then
            PR_NUMBER=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null || echo "")
          fi
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

          # Get failed jobs
          FAILED_JOBS=$(gh api \
            "/repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" \
            --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")' \
            2>/dev/null || echo "Unknown")
          echo "failed_jobs=$FAILED_JOBS" >> $GITHUB_OUTPUT

          echo "::notice::Workflow: $WORKFLOW_NAME | Run: $RUN_ID | Branch: $BRANCH | Failed Jobs: $FAILED_JOBS"

      - name: Download workflow logs
        id: logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ${{ env.EVIDENCE_DIR }}
          RUN_ID="${{ github.event.workflow_run.id }}"

          # Download logs
          gh api \
            "/repos/${{ github.repository }}/actions/runs/$RUN_ID/logs" \
            > "${{ env.EVIDENCE_DIR }}/workflow-logs.zip" 2>/dev/null || true

          if [ -f "${{ env.EVIDENCE_DIR }}/workflow-logs.zip" ]; then
            unzip -o "${{ env.EVIDENCE_DIR }}/workflow-logs.zip" -d "${{ env.EVIDENCE_DIR }}/logs" 2>/dev/null || true
            # Extract last 500 lines of error context
            find "${{ env.EVIDENCE_DIR }}/logs" -name "*.txt" -exec tail -100 {} \; > "${{ env.EVIDENCE_DIR }}/error-context.txt" 2>/dev/null || true
            echo "logs_downloaded=true" >> $GITHUB_OUTPUT
          else
            echo "Could not download logs" > "${{ env.EVIDENCE_DIR }}/error-context.txt"
            echo "logs_downloaded=false" >> $GITHUB_OUTPUT
          fi

      - name: Classify failure
        id: classify
        run: |
          LOG_FILE="${{ env.EVIDENCE_DIR }}/error-context.txt"

          # Initialize
          FAILURE_CLASS="UNKNOWN"
          SEVERITY="P2"
          IS_SAFE_AUTOFIX="false"
          ERROR_SUMMARY="Failure requires investigation"

          if [ -f "$LOG_FILE" ]; then
            LOG_CONTENT=$(cat "$LOG_FILE" | head -1000)

            # =================================================================
            # Classification Rules (order matters - first match wins)
            # =================================================================

            # FLAKE: Transient failures
            if echo "$LOG_CONTENT" | grep -qiE "(ECONNRESET|ETIMEDOUT|ECONNREFUSED|socket hang up|network timeout|rate limit|429|503|504)"; then
              FAILURE_CLASS="FLAKE"
              SEVERITY="P3"
              ERROR_SUMMARY="Transient network/service failure detected"

            # MIGRATION: Schema/migration issues
            elif echo "$LOG_CONTENT" | grep -qiE "(migration.*fail|schema.*drift|column.*not.*exist|relation.*does not exist|constraint.*violation|duplicate key)"; then
              FAILURE_CLASS="MIGRATION"
              SEVERITY="P0"
              ERROR_SUMMARY="Database migration or schema issue"

            # SECURITY: Security scan failures
            elif echo "$LOG_CONTENT" | grep -qiE "(vulnerability|CVE-|security.*fail|secret.*detect|credential.*expos|trivy|audit.*high|audit.*critical)"; then
              FAILURE_CLASS="SECURITY"
              SEVERITY="P0"
              ERROR_SUMMARY="Security vulnerability or policy violation"

            # POLICY: Charter/gate violations
            elif echo "$LOG_CONTENT" | grep -qiE "(charter.*violation|gate.*fail|required check|branch protection|forbidden|policy.*fail)"; then
              FAILURE_CLASS="POLICY"
              SEVERITY="P1"
              ERROR_SUMMARY="Policy or governance gate failure"

            # CONFIG: Environment/configuration issues (SAFE AUTOFIX candidate)
            elif echo "$LOG_CONTENT" | grep -qiE "(env.*not.*set|missing.*env|config.*error|\.env|environment variable|secret.*missing)"; then
              FAILURE_CLASS="CONFIG"
              SEVERITY="P2"
              ERROR_SUMMARY="Configuration or environment issue"

            # LINT: Linting failures (SAFE AUTOFIX)
            elif echo "$LOG_CONTENT" | grep -qiE "(eslint|prettier|lint.*error|formatting.*error|style.*violation)"; then
              FAILURE_CLASS="LINT"
              SEVERITY="P3"
              IS_SAFE_AUTOFIX="true"
              ERROR_SUMMARY="Linting or formatting error - auto-fixable"

            # TYPESCRIPT: Type errors (sometimes auto-fixable)
            elif echo "$LOG_CONTENT" | grep -qiE "(TS[0-9]+:|type.*error|typescript|tsc.*error|cannot find.*module|has no exported member)"; then
              FAILURE_CLASS="TYPESCRIPT"
              SEVERITY="P2"
              ERROR_SUMMARY="TypeScript compilation error"

            # TEST: Test failures
            elif echo "$LOG_CONTENT" | grep -qiE "(test.*fail|expect.*received|assertion.*fail|jest|vitest|playwright.*fail|FAIL.*spec)"; then
              FAILURE_CLASS="TEST"
              SEVERITY="P1"
              ERROR_SUMMARY="Test suite failure"

            # BUILD: Build failures
            elif echo "$LOG_CONTENT" | grep -qiE "(build.*fail|compile.*error|webpack.*error|esbuild.*error|rollup.*error|next.*build.*fail)"; then
              FAILURE_CLASS="BUILD"
              SEVERITY="P1"
              ERROR_SUMMARY="Build process failure"

            # DEPENDENCY: Dependency issues (sometimes auto-fixable)
            elif echo "$LOG_CONTENT" | grep -qiE "(npm.*err|package.*not found|peer.*depend|ERESOLVE|lockfile|node_modules)"; then
              FAILURE_CLASS="DEPENDENCY"
              SEVERITY="P2"
              ERROR_SUMMARY="Dependency resolution error"

            # REGRESSION: General regression (catch-all for repeated failures)
            else
              FAILURE_CLASS="REGRESSION"
              SEVERITY="P1"
              ERROR_SUMMARY="Unclassified failure - requires investigation"
            fi
          fi

          echo "failure_class=$FAILURE_CLASS" >> $GITHUB_OUTPUT
          echo "severity=$SEVERITY" >> $GITHUB_OUTPUT
          echo "is_safe_autofix=$IS_SAFE_AUTOFIX" >> $GITHUB_OUTPUT
          echo "error_summary=$ERROR_SUMMARY" >> $GITHUB_OUTPUT

          echo "::notice::Classification: $FAILURE_CLASS (Severity: $SEVERITY, Safe Autofix: $IS_SAFE_AUTOFIX)"

      - name: Generate evidence report
        id: evidence
        run: |
          EVIDENCE_FILE="${{ env.EVIDENCE_DIR }}/failure-report-${{ github.event.workflow_run.id }}.md"

          cat > "$EVIDENCE_FILE" << 'EVIDENCE_EOF'
          # CI Failure Report

          **Generated**: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          **Run ID**: ${{ github.event.workflow_run.id }}

          ## Summary

          | Field | Value |
          |-------|-------|
          | **Workflow** | ${{ steps.context.outputs.workflow_name }} |
          | **Classification** | ${{ steps.classify.outputs.failure_class }} |
          | **Severity** | ${{ steps.classify.outputs.severity }} |
          | **Branch** | ${{ steps.context.outputs.branch_name }} |
          | **Commit** | ${{ steps.context.outputs.commit_sha }} |
          | **PR** | ${{ steps.context.outputs.pr_number || 'N/A' }} |
          | **Failed Jobs** | ${{ steps.context.outputs.failed_jobs }} |

          ## Error Summary

          ${{ steps.classify.outputs.error_summary }}

          ## Evidence Links

          - [Failed Run](${{ steps.context.outputs.run_url }})
          - [Commit](https://github.com/${{ github.repository }}/commit/${{ steps.context.outputs.commit_sha }})

          ## Error Context (Last 100 lines)

          ```
          EVIDENCE_EOF

          if [ -f "${{ env.EVIDENCE_DIR }}/error-context.txt" ]; then
            tail -100 "${{ env.EVIDENCE_DIR }}/error-context.txt" >> "$EVIDENCE_FILE"
          fi

          echo '```' >> "$EVIDENCE_FILE"

          echo "evidence_file=$EVIDENCE_FILE" >> $GITHUB_OUTPUT

      - name: Upload evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-evidence-${{ github.event.workflow_run.id }}
          path: ${{ env.EVIDENCE_DIR }}/
          retention-days: 30

  # ==========================================================================
  # Job 2: Safe Autofix (LINT/FORMAT only)
  # ==========================================================================
  safe-autofix:
    name: Safe Autofix
    runs-on: ubuntu-latest
    needs: collect-and-classify
    if: |
      needs.collect-and-classify.outputs.is_safe_autofix == 'true' &&
      needs.collect-and-classify.outputs.branch_name != 'main' &&
      needs.collect-and-classify.outputs.branch_name != ''
    steps:
      - name: Checkout failing branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.collect-and-classify.outputs.branch_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create fix branch
        id: fix-branch
        run: |
          FIX_BRANCH="autofix/${{ needs.collect-and-classify.outputs.branch_name }}-${{ github.event.workflow_run.id }}"
          git checkout -b "$FIX_BRANCH"
          echo "fix_branch=$FIX_BRANCH" >> $GITHUB_OUTPUT

      - name: Apply lint fixes
        id: lint-fix
        continue-on-error: true
        run: |
          # Run ESLint with autofix
          npm run lint:fix 2>&1 | tee lint-output.txt || true

          # Run Prettier
          npm run format 2>&1 | tee -a lint-output.txt || true

          # Check if there are changes
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit fixes
        if: steps.lint-fix.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "fix(ci): auto-fix lint/format errors

          Automated fix for CI failure in workflow run #${{ github.event.workflow_run.id }}

          Classification: ${{ needs.collect-and-classify.outputs.failure_class }}
          Original branch: ${{ needs.collect-and-classify.outputs.branch_name }}

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

      - name: Push fix branch
        if: steps.lint-fix.outputs.has_changes == 'true'
        run: |
          git push origin "${{ steps.fix-branch.outputs.fix_branch }}"

      - name: Create autofix PR
        if: steps.lint-fix.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "fix(ci): Auto-fix ${{ needs.collect-and-classify.outputs.failure_class }} errors" \
            --body "$(cat <<'PR_BODY_EOF'
          ## CI Auto-Fix: ${{ needs.collect-and-classify.outputs.failure_class }}

          **Generated by**: CI Failure Resolver (Phase A)
          **Run ID**: ${{ github.event.workflow_run.id }}
          **Classification**: ${{ needs.collect-and-classify.outputs.failure_class }} (Severity: ${{ needs.collect-and-classify.outputs.severity }})

          ---

          ### Summary

          ${{ needs.collect-and-classify.outputs.error_summary }}

          ### Root Cause

          Automated linting/formatting detected fixable issues in the codebase.

          ### Changes Applied

          - ESLint auto-fix (`npm run lint:fix`)
          - Prettier formatting (`npm run format`)

          ### Prevention

          - Run `npm run lint:fix && npm run format` before committing
          - Enable pre-commit hooks: `npm run prepare`

          ### Evidence

          - **Failed Run**: [${{ github.event.workflow_run.id }}](${{ needs.collect-and-classify.outputs.run_url }})
          - **Original Branch**: `${{ needs.collect-and-classify.outputs.branch_name }}`
          - **Commit**: `${{ needs.collect-and-classify.outputs.commit_sha }}`

          ### Verification

          - [ ] Fix addresses root cause
          - [ ] No unintended side effects
          - [ ] CI passes on this PR
          - [ ] Reviewed by human

          ---

          > **Note**: This PR was auto-generated. Human review and approval required before merge.
          > See [AUTO_RESOLUTION_POLICY.md](docs/ops/AUTO_RESOLUTION_POLICY.md) for details.
          PR_BODY_EOF
          )" \
            --base "${{ needs.collect-and-classify.outputs.branch_name }}" \
            --head "${{ steps.fix-branch.outputs.fix_branch }}" \
            --label "auto-fix" \
            --label "ci-failed" \
            --label "ci:${{ needs.collect-and-classify.outputs.failure_class }}"

      - name: No changes detected
        if: steps.lint-fix.outputs.has_changes != 'true'
        run: |
          echo "::notice::No auto-fixable changes detected. Manual intervention required."

  # ==========================================================================
  # Job 3: Create Issue/Comment for Non-Autofix Failures
  # ==========================================================================
  create-issue-or-comment:
    name: Create Issue/Comment
    runs-on: ubuntu-latest
    needs: collect-and-classify
    if: |
      needs.collect-and-classify.outputs.is_safe_autofix != 'true' &&
      needs.collect-and-classify.outputs.failure_class != 'FLAKE'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Comment on existing PR
        if: needs.collect-and-classify.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ needs.collect-and-classify.outputs.pr_number }} --body "$(cat <<'COMMENT_EOF'
          ## CI Failure Summary

          | Field | Value |
          |-------|-------|
          | **Classification** | ${{ needs.collect-and-classify.outputs.failure_class }} |
          | **Severity** | ${{ needs.collect-and-classify.outputs.severity }} |
          | **Run** | [${{ github.event.workflow_run.id }}](${{ needs.collect-and-classify.outputs.run_url }}) |
          | **Failed Jobs** | ${{ needs.collect-and-classify.outputs.failed_jobs }} |

          ### What Failed

          ${{ needs.collect-and-classify.outputs.error_summary }}

          ### Classification Rationale

          Based on log analysis, this failure was classified as **${{ needs.collect-and-classify.outputs.failure_class }}**.

          ### Recommended Action

          $(case "${{ needs.collect-and-classify.outputs.failure_class }}" in
            MIGRATION) echo "Review database migrations. Check for schema drift. See [MIGRATION_RUNBOOK.md](docs/ops/MIGRATION_RUNBOOK.md)." ;;
            SECURITY) echo "Address security vulnerabilities immediately. This is a **P0** issue. See [incident_response_playbook.md](docs/ops/incident_response_playbook.md)." ;;
            POLICY) echo "Review policy violation. Ensure compliance with [PRODUCTION_CHARTER.md](docs/PRODUCTION_CHARTER.md)." ;;
            TYPESCRIPT) echo "Fix TypeScript errors. Run \`npm run type-check\` locally." ;;
            TEST) echo "Fix failing tests. Run \`npm test\` locally to reproduce." ;;
            BUILD) echo "Fix build errors. Run \`npm run build\` locally." ;;
            CONFIG) echo "Check environment configuration. Ensure all required env vars are set." ;;
            DEPENDENCY) echo "Resolve dependency issues. Try \`rm -rf node_modules && npm ci\`." ;;
            *) echo "Investigate the failure manually. Check logs for details." ;;
          esac)

          ### Evidence

          - [Failure logs](${{ needs.collect-and-classify.outputs.run_url }})
          - [Classification guide](docs/ops/CI_FAILURE_CLASSIFICATION.md)

          ---

          <details>
          <summary>Labels to add</summary>

          - \`needs-human\`
          - \`ci-failed\`
          - \`ci:${{ needs.collect-and-classify.outputs.failure_class }}\`
          - \`severity:${{ needs.collect-and-classify.outputs.severity }}\`

          </details>
          COMMENT_EOF
          )"

          # Add labels to PR
          gh pr edit ${{ needs.collect-and-classify.outputs.pr_number }} \
            --add-label "needs-human" \
            --add-label "ci-failed" \
            --add-label "ci:${{ needs.collect-and-classify.outputs.failure_class }}" \
            --add-label "severity:${{ needs.collect-and-classify.outputs.severity }}" 2>/dev/null || true

      - name: Create issue for main branch failures
        if: |
          needs.collect-and-classify.outputs.pr_number == '' &&
          needs.collect-and-classify.outputs.branch_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "CI Incident: ${{ needs.collect-and-classify.outputs.failure_class }} - ${{ needs.collect-and-classify.outputs.workflow_name }}" \
            --body "$(cat <<'ISSUE_EOF'
          ## CI Incident: ${{ needs.collect-and-classify.outputs.failure_class }}

          **Severity**: ${{ needs.collect-and-classify.outputs.severity }}
          **Classification**: ${{ needs.collect-and-classify.outputs.failure_class }}
          **Status**: Open

          ---

          ### Timeline

          | Time | Event |
          |------|-------|
          | $(date -u +"%Y-%m-%dT%H:%M:%SZ") | Failure detected |
          | $(date -u +"%Y-%m-%dT%H:%M:%SZ") | Classified as ${{ needs.collect-and-classify.outputs.failure_class }} |

          ### Failure Details

          - **Workflow**: ${{ needs.collect-and-classify.outputs.workflow_name }}
          - **Run ID**: [${{ github.event.workflow_run.id }}](${{ needs.collect-and-classify.outputs.run_url }})
          - **Branch**: ${{ needs.collect-and-classify.outputs.branch_name }}
          - **Commit**: ${{ needs.collect-and-classify.outputs.commit_sha }}
          - **Failed Jobs**: ${{ needs.collect-and-classify.outputs.failed_jobs }}

          ### Error Summary

          ${{ needs.collect-and-classify.outputs.error_summary }}

          ### Recommended Actions

          $(case "${{ needs.collect-and-classify.outputs.failure_class }}" in
            MIGRATION) echo "1. Check migration logs\n2. Verify schema state\n3. Consider rollback if P0" ;;
            SECURITY) echo "1. IMMEDIATE: Review security findings\n2. Patch vulnerabilities\n3. Update dependencies" ;;
            POLICY) echo "1. Review policy violation details\n2. Check PRODUCTION_CHARTER.md\n3. Remediate compliance gap" ;;
            *) echo "1. Review failure logs\n2. Reproduce locally\n3. Fix and verify" ;;
          esac)

          ### Affected Components

          - Workflow: ${{ needs.collect-and-classify.outputs.workflow_name }}
          - Jobs: ${{ needs.collect-and-classify.outputs.failed_jobs }}

          ---

          > Auto-generated by CI Failure Resolver. See [CI_FAILURE_CLASSIFICATION.md](docs/ops/CI_FAILURE_CLASSIFICATION.md).
          ISSUE_EOF
          )" \
            --label "needs-human" \
            --label "ci-failed" \
            --label "ci:${{ needs.collect-and-classify.outputs.failure_class }}" \
            --label "severity:${{ needs.collect-and-classify.outputs.severity }}"

  # ==========================================================================
  # Job 4: Handle Flakes (Retry suggestion only in Phase A)
  # ==========================================================================
  handle-flake:
    name: Handle Flake
    runs-on: ubuntu-latest
    needs: collect-and-classify
    if: needs.collect-and-classify.outputs.failure_class == 'FLAKE'
    steps:
      - name: Log flake detection
        run: |
          echo "::notice::Flake detected in ${{ needs.collect-and-classify.outputs.workflow_name }}"
          echo "Run URL: ${{ needs.collect-and-classify.outputs.run_url }}"
          echo "Consider re-running the workflow manually."

      - name: Comment on PR if exists
        if: needs.collect-and-classify.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ needs.collect-and-classify.outputs.pr_number }} --body "$(cat <<'FLAKE_EOF'
          ## Flaky CI Failure Detected

          | Field | Value |
          |-------|-------|
          | **Classification** | FLAKE |
          | **Severity** | P3 |
          | **Run** | [${{ github.event.workflow_run.id }}](${{ needs.collect-and-classify.outputs.run_url }}) |

          ### What Happened

          ${{ needs.collect-and-classify.outputs.error_summary }}

          ### Recommended Action

          This appears to be a transient failure (network timeout, rate limit, etc.).

          **Options:**
          1. Re-run the failed workflow: [Re-run jobs](${{ needs.collect-and-classify.outputs.run_url }})
          2. If this persists, investigate infrastructure stability

          ---

          > This is an informational comment. No action required unless failure persists.
          FLAKE_EOF
          )"

  # ==========================================================================
  # Job 5: Auto-Revert PR Generation (Phase C - Feature Flagged)
  # ==========================================================================
  auto-revert:
    name: Auto-Revert PR
    runs-on: ubuntu-latest
    needs: collect-and-classify
    # Only run for protected branch failures that are NOT flakes
    if: |
      needs.collect-and-classify.outputs.is_protected_branch == 'true' &&
      needs.collect-and-classify.outputs.failure_class != 'FLAKE' &&
      needs.collect-and-classify.outputs.pr_number == ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.collect-and-classify.outputs.branch_name }}
          fetch-depth: 10

      - name: Check auto-revert feature flag
        id: check-flag
        run: |
          AUTO_REVERT="${{ needs.collect-and-classify.outputs.auto_revert_enabled }}"
          echo "auto_revert_enabled=$AUTO_REVERT" >> $GITHUB_OUTPUT
          if [ "$AUTO_REVERT" = "true" ]; then
            echo "::notice::Auto-revert is ENABLED - will create revert PR"
          else
            echo "::notice::Auto-revert is DISABLED - will create issue recommending revert"
          fi

      - name: Get commit info for revert
        id: commit-info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_SHA="${{ needs.collect-and-classify.outputs.commit_sha }}"

          # Get commit message and author
          COMMIT_MSG=$(git log -1 --format="%s" "$COMMIT_SHA" 2>/dev/null || echo "Unknown commit")
          COMMIT_AUTHOR=$(git log -1 --format="%an" "$COMMIT_SHA" 2>/dev/null || echo "Unknown")
          COMMIT_SHORT="${COMMIT_SHA:0:7}"

          # Try to find the PR that merged this commit
          MERGED_PR=$(gh api "/repos/${{ github.repository }}/commits/$COMMIT_SHA/pulls" \
            --jq '.[0].number' 2>/dev/null || echo "")

          echo "commit_msg=$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "commit_author=$COMMIT_AUTHOR" >> $GITHUB_OUTPUT
          echo "commit_short=$COMMIT_SHORT" >> $GITHUB_OUTPUT
          echo "merged_pr=$MERGED_PR" >> $GITHUB_OUTPUT

          echo "::notice::Commit to revert: $COMMIT_SHORT by $COMMIT_AUTHOR"

      # ========================================================================
      # Path A: Auto-Revert ENABLED - Create Revert PR
      # ========================================================================
      - name: Create revert branch
        id: revert-branch
        if: steps.check-flag.outputs.auto_revert_enabled == 'true'
        run: |
          COMMIT_SHA="${{ needs.collect-and-classify.outputs.commit_sha }}"
          BRANCH="${{ needs.collect-and-classify.outputs.branch_name }}"
          REVERT_BRANCH="revert/$BRANCH-${{ steps.commit-info.outputs.commit_short }}-${{ github.event.workflow_run.id }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create revert branch from current state
          git checkout -b "$REVERT_BRANCH"

          echo "revert_branch=$REVERT_BRANCH" >> $GITHUB_OUTPUT

      - name: Perform git revert
        id: git-revert
        if: steps.check-flag.outputs.auto_revert_enabled == 'true'
        run: |
          COMMIT_SHA="${{ needs.collect-and-classify.outputs.commit_sha }}"

          # Attempt to revert the commit
          # Use --no-edit to auto-generate commit message
          # NEVER use --force or push --force
          if git revert --no-edit "$COMMIT_SHA"; then
            echo "revert_success=true" >> $GITHUB_OUTPUT
            echo "::notice::Successfully reverted commit $COMMIT_SHA"
          else
            echo "revert_success=false" >> $GITHUB_OUTPUT
            echo "::warning::Revert failed - likely has conflicts. Manual intervention required."
            # Abort the failed revert to leave clean state
            git revert --abort 2>/dev/null || true
          fi

      - name: Push revert branch
        if: |
          steps.check-flag.outputs.auto_revert_enabled == 'true' &&
          steps.git-revert.outputs.revert_success == 'true'
        run: |
          # Push WITHOUT force - safe push only
          git push origin "${{ steps.revert-branch.outputs.revert_branch }}"

      - name: Create revert PR
        if: |
          steps.check-flag.outputs.auto_revert_enabled == 'true' &&
          steps.git-revert.outputs.revert_success == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ORIGINAL_PR="${{ steps.commit-info.outputs.merged_pr }}"
          PR_REF=""
          if [ -n "$ORIGINAL_PR" ]; then
            PR_REF="Reverts: #$ORIGINAL_PR"
          fi

          gh pr create \
            --title "revert: ${{ steps.commit-info.outputs.commit_msg }}" \
            --body "$(cat <<'REVERT_PR_EOF'
          ## Revert: ${{ steps.commit-info.outputs.commit_msg }}

          **Generated by**: CI Failure Resolver (Phase C)
          **Reason**: CI failure on protected branch `${{ needs.collect-and-classify.outputs.branch_name }}`
          **Classification**: ${{ needs.collect-and-classify.outputs.failure_class }} (Severity: ${{ needs.collect-and-classify.outputs.severity }})

          ---

          ### Why Revert?

          The CI pipeline failed on the protected branch after this commit was merged.
          This revert restores the branch to a green state while the issue is investigated.

          **Error Summary**: ${{ needs.collect-and-classify.outputs.error_summary }}

          ### Original Commit

          - **Commit**: [`${{ steps.commit-info.outputs.commit_short }}`](https://github.com/${{ github.repository }}/commit/${{ needs.collect-and-classify.outputs.commit_sha }})
          - **Author**: ${{ steps.commit-info.outputs.commit_author }}
          - **Message**: ${{ steps.commit-info.outputs.commit_msg }}
          REVERT_PR_EOF
          )"

          # Add the PR reference if we found one
          if [ -n "$ORIGINAL_PR" ]; then
            echo "" >> /dev/null
          fi

          cat <<'REVERT_PR_CONT' | gh pr edit --add-body -
          ### Evidence

          - **Failed Run**: [${{ github.event.workflow_run.id }}](${{ needs.collect-and-classify.outputs.run_url }})
          - **Workflow**: ${{ needs.collect-and-classify.outputs.workflow_name }}
          - **Failed Jobs**: ${{ needs.collect-and-classify.outputs.failed_jobs }}

          ### Next Steps

          1. **Merge this revert** to restore green CI
          2. **Investigate** the root cause of the failure
          3. **Fix forward** with a new PR that addresses the issue
          4. **Re-apply** the original changes with the fix included

          ### Verification Checklist

          - [ ] Revert PR passes CI
          - [ ] Original author notified
          - [ ] Root cause investigation started
          - [ ] Fix-forward PR planned

          ---

          > **IMPORTANT**: This revert was auto-generated but **NOT auto-merged**.
          > Human review required before merging.
          > See [FORBIDDEN_ACTIONS.md](docs/ops/FORBIDDEN_ACTIONS.md) for policy.
          REVERT_PR_CONT

          gh pr edit \
            --add-label "auto-revert" \
            --add-label "ci-restore-green" \
            --add-label "ci-failed" \
            --add-label "ci:${{ needs.collect-and-classify.outputs.failure_class }}" \
            --add-label "severity:${{ needs.collect-and-classify.outputs.severity }}"

      - name: Notify revert conflict
        if: |
          steps.check-flag.outputs.auto_revert_enabled == 'true' &&
          steps.git-revert.outputs.revert_success != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Manual Revert Required: ${{ steps.commit-info.outputs.commit_msg }}" \
            --body "$(cat <<'CONFLICT_EOF'
          ## Manual Revert Required

          **Reason**: Automatic revert failed due to conflicts
          **Classification**: ${{ needs.collect-and-classify.outputs.failure_class }} (Severity: ${{ needs.collect-and-classify.outputs.severity }})

          ---

          ### What Happened

          The CI Failure Resolver attempted to create a revert PR for a failing commit on
          `${{ needs.collect-and-classify.outputs.branch_name }}`, but the git revert operation
          encountered merge conflicts.

          ### Commit to Revert

          - **Commit**: [`${{ steps.commit-info.outputs.commit_short }}`](https://github.com/${{ github.repository }}/commit/${{ needs.collect-and-classify.outputs.commit_sha }})
          - **Author**: ${{ steps.commit-info.outputs.commit_author }}
          - **Message**: ${{ steps.commit-info.outputs.commit_msg }}

          ### CI Failure Details

          - **Failed Run**: [${{ github.event.workflow_run.id }}](${{ needs.collect-and-classify.outputs.run_url }})
          - **Workflow**: ${{ needs.collect-and-classify.outputs.workflow_name }}
          - **Error**: ${{ needs.collect-and-classify.outputs.error_summary }}

          ### Required Actions

          1. **Manually create revert**: `git revert ${{ needs.collect-and-classify.outputs.commit_sha }}`
          2. **Resolve conflicts** in the revert commit
          3. **Open PR** to restore green CI
          4. **Investigate** root cause

          ---

          > This issue was auto-generated because automatic revert failed.
          CONFLICT_EOF
          )" \
            --label "needs-human" \
            --label "ci-restore-green" \
            --label "ci-failed" \
            --label "severity:${{ needs.collect-and-classify.outputs.severity }}"

      # ========================================================================
      # Path B: Auto-Revert DISABLED - Create Issue Recommending Revert
      # ========================================================================
      - name: Create revert recommendation issue
        if: steps.check-flag.outputs.auto_revert_enabled != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "CI Failure on ${{ needs.collect-and-classify.outputs.branch_name }}: Revert Recommended" \
            --body "$(cat <<'RECOMMEND_EOF'
          ## CI Failure on Protected Branch

          **Branch**: `${{ needs.collect-and-classify.outputs.branch_name }}`
          **Classification**: ${{ needs.collect-and-classify.outputs.failure_class }} (Severity: ${{ needs.collect-and-classify.outputs.severity }})
          **Status**: Revert Recommended

          ---

          ### Summary

          The CI pipeline failed on the protected branch `${{ needs.collect-and-classify.outputs.branch_name }}`.
          To restore green CI, consider reverting the offending commit.

          **Error**: ${{ needs.collect-and-classify.outputs.error_summary }}

          ### Commit to Consider Reverting

          - **Commit**: [`${{ steps.commit-info.outputs.commit_short }}`](https://github.com/${{ github.repository }}/commit/${{ needs.collect-and-classify.outputs.commit_sha }})
          - **Author**: ${{ steps.commit-info.outputs.commit_author }}
          - **Message**: ${{ steps.commit-info.outputs.commit_msg }}

          ### Failure Details

          - **Failed Run**: [${{ github.event.workflow_run.id }}](${{ needs.collect-and-classify.outputs.run_url }})
          - **Workflow**: ${{ needs.collect-and-classify.outputs.workflow_name }}
          - **Failed Jobs**: ${{ needs.collect-and-classify.outputs.failed_jobs }}

          ### Recommended Actions

          **Option 1: Revert the commit**
          ```bash
          git checkout ${{ needs.collect-and-classify.outputs.branch_name }}
          git pull
          git revert ${{ needs.collect-and-classify.outputs.commit_sha }}
          git push origin ${{ needs.collect-and-classify.outputs.branch_name }}
          ```

          **Option 2: Fix forward**
          - Identify the root cause
          - Create a fix PR targeting `${{ needs.collect-and-classify.outputs.branch_name }}`

          ### Why Automatic Revert is Disabled

          The `AUTO_REVERT_ENABLED` feature flag is currently set to `false`.
          To enable automatic revert PR creation, update `runtime_config/ci_automation.json`:
          ```json
          {
            "features": {
              "AUTO_REVERT_ENABLED": true
            }
          }
          ```

          See [AUTO_RESOLUTION_POLICY.md](docs/ops/AUTO_RESOLUTION_POLICY.md) for details.

          ---

          > Auto-generated by CI Failure Resolver.
          > Automatic revert is disabled by feature flag.
          RECOMMEND_EOF
          )" \
            --label "needs-human" \
            --label "ci-restore-green" \
            --label "ci-failed" \
            --label "ci:${{ needs.collect-and-classify.outputs.failure_class }}" \
            --label "severity:${{ needs.collect-and-classify.outputs.severity }}"

  # ==========================================================================
  # Job 6: Autopilot Freeze Integration (Phase D - Feature Flagged)
  # ==========================================================================
  autopilot-freeze:
    name: Autopilot Freeze
    runs-on: ubuntu-latest
    needs: collect-and-classify
    # Trigger on high-risk failure classes that warrant autopilot freeze
    if: |
      needs.collect-and-classify.outputs.autopilot_freeze_enabled == 'true' &&
      (needs.collect-and-classify.outputs.failure_class == 'MIGRATION' ||
       needs.collect-and-classify.outputs.failure_class == 'SECURITY' ||
       needs.collect-and-classify.outputs.failure_class == 'POLICY')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Determine freeze scope and lane
        id: freeze-config
        run: |
          FAILURE_CLASS="${{ needs.collect-and-classify.outputs.failure_class }}"
          WORKFLOW_NAME="${{ needs.collect-and-classify.outputs.workflow_name }}"

          # Default to global freeze
          SCOPE="ALL"
          LANE=""

          # Determine scope based on failure class
          case "$FAILURE_CLASS" in
            MIGRATION)
              SCOPE="DATA_OPERATIONS"
              # Check if this is a scoring-related workflow
              if echo "$WORKFLOW_NAME" | grep -qiE "(scoring|grade)"; then
                LANE="ScoringAgent"
              # Check if this is settlement-related
              elif echo "$WORKFLOW_NAME" | grep -qiE "(settlement|payout)"; then
                LANE="SettlementAgent"
              fi
              ;;
            SECURITY)
              SCOPE="ALL"
              # Security issues freeze everything
              ;;
            POLICY)
              SCOPE="DEPLOYMENTS"
              # Check for specific agent patterns in workflow
              if echo "$WORKFLOW_NAME" | grep -qiE "(grading|grade)"; then
                LANE="GradingAgent"
              elif echo "$WORKFLOW_NAME" | grep -qiE "(publish|discord)"; then
                LANE="PublishingAgent"
              fi
              ;;
          esac

          echo "scope=$SCOPE" >> $GITHUB_OUTPUT
          echo "lane=$LANE" >> $GITHUB_OUTPUT
          echo "::notice::Freeze scope: $SCOPE, Lane: ${LANE:-ALL}"

      - name: Activate autopilot freeze
        id: freeze
        run: |
          INCIDENT_ID="ci-${{ github.event.workflow_run.id }}"
          REASON="CI Failure: ${{ needs.collect-and-classify.outputs.failure_class }} in ${{ needs.collect-and-classify.outputs.workflow_name }}"
          SCOPE="${{ steps.freeze-config.outputs.scope }}"
          LANE="${{ steps.freeze-config.outputs.lane }}"

          # Build freeze command
          FREEZE_CMD="pnpm exec tsx scripts/ops/set-autopilot-mode.ts --mode=SAFE"
          FREEZE_CMD="$FREEZE_CMD --reason=\"$REASON\""
          FREEZE_CMD="$FREEZE_CMD --scope=$SCOPE"
          FREEZE_CMD="$FREEZE_CMD --triggered-by=ci-failure-resolver"
          FREEZE_CMD="$FREEZE_CMD --incident=$INCIDENT_ID"
          FREEZE_CMD="$FREEZE_CMD --auto-unfreeze-hours=4"

          if [ -n "$LANE" ]; then
            FREEZE_CMD="$FREEZE_CMD --lane=$LANE"
          fi

          echo "::group::Executing autopilot freeze"
          echo "Command: $FREEZE_CMD"
          eval $FREEZE_CMD
          echo "::endgroup::"

          echo "freeze_activated=true" >> $GITHUB_OUTPUT

      - name: Commit freeze state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet runtime_config/autopilot_state.json; then
            echo "No changes to commit"
          else
            git add runtime_config/autopilot_state.json
            git commit -m "ci: activate autopilot freeze (incident: ci-${{ github.event.workflow_run.id }})

          Failure Class: ${{ needs.collect-and-classify.outputs.failure_class }}
          Workflow: ${{ needs.collect-and-classify.outputs.workflow_name }}
          Scope: ${{ steps.freeze-config.outputs.scope }}
          Lane: ${{ steps.freeze-config.outputs.lane || 'ALL' }}

          Auto-unfreeze scheduled in 4 hours.
          See: docs/ops/AUTOPILOT_FREEZE_MATRIX.md for rollback procedure."

            # Push to main/current branch
            git push origin HEAD:${{ needs.collect-and-classify.outputs.branch_name }} || \
              echo "::warning::Could not push freeze state. Manual intervention may be required."
          fi

      - name: Log freeze evidence
        run: |
          echo "==================================================================="
          echo "AUTOPILOT FREEZE ACTIVATED"
          echo "==================================================================="
          echo ""
          echo "Incident ID:     ci-${{ github.event.workflow_run.id }}"
          echo "Failure Class:   ${{ needs.collect-and-classify.outputs.failure_class }}"
          echo "Severity:        ${{ needs.collect-and-classify.outputs.severity }}"
          echo "Scope:           ${{ steps.freeze-config.outputs.scope }}"
          echo "Lane:            ${{ steps.freeze-config.outputs.lane || 'ALL' }}"
          echo "Workflow:        ${{ needs.collect-and-classify.outputs.workflow_name }}"
          echo "Run URL:         ${{ needs.collect-and-classify.outputs.run_url }}"
          echo ""
          echo "Auto-unfreeze:   In 4 hours"
          echo ""
          echo "To manually unfreeze:"
          echo "  pnpm exec tsx scripts/ops/set-autopilot-mode.ts --mode=NORMAL"
          echo ""
          echo "See: docs/ops/AUTOPILOT_FREEZE_MATRIX.md"
          echo "==================================================================="

      - name: Create freeze notification issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Autopilot Frozen: ${{ needs.collect-and-classify.outputs.failure_class }} - ci-${{ github.event.workflow_run.id }}" \
            --body "$(cat <<'FREEZE_ISSUE_EOF'
          ## Autopilot Freeze Activated

          **Status**: FROZEN (SAFE MODE)
          **Incident ID**: ci-${{ github.event.workflow_run.id }}
          **Triggered At**: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          **Auto-Unfreeze**: $(date -u -d "+4 hours" +"%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || echo "In 4 hours")

          ---

          ### Freeze Configuration

          | Field | Value |
          |-------|-------|
          | **Scope** | ${{ steps.freeze-config.outputs.scope }} |
          | **Lane** | ${{ steps.freeze-config.outputs.lane || 'ALL' }} |
          | **Failure Class** | ${{ needs.collect-and-classify.outputs.failure_class }} |
          | **Severity** | ${{ needs.collect-and-classify.outputs.severity }} |

          ### Why Frozen?

          A high-risk CI failure was detected that warrants pausing autopilot operations:

          **Error Summary**: ${{ needs.collect-and-classify.outputs.error_summary }}

          ### Affected Operations

          While frozen, the following operations are paused:
          - **Scope ${{ steps.freeze-config.outputs.scope }}**: $(case "${{ steps.freeze-config.outputs.scope }}" in
              ALL) echo "All autopilot operations paused" ;;
              DEPLOYMENTS) echo "Deployment operations paused" ;;
              DATA_OPERATIONS) echo "Data-modifying operations paused" ;;
              AFFECTED_FLOW) echo "Specific agent lane paused" ;;
            esac)

          ### Rollback / Unfreeze Procedure

          **Option 1: Wait for auto-unfreeze** (4 hours)

          **Option 2: Manual unfreeze**
          \`\`\`bash
          pnpm exec tsx scripts/ops/set-autopilot-mode.ts --mode=NORMAL
          git add runtime_config/autopilot_state.json
          git commit -m "ci: unfreeze autopilot (manual)"
          git push
          \`\`\`

          **Option 3: Check current status**
          \`\`\`bash
          pnpm exec tsx scripts/ops/set-autopilot-mode.ts --status
          \`\`\`

          ### Evidence

          - **Failed Run**: [${{ github.event.workflow_run.id }}](${{ needs.collect-and-classify.outputs.run_url }})
          - **Workflow**: ${{ needs.collect-and-classify.outputs.workflow_name }}
          - **Failed Jobs**: ${{ needs.collect-and-classify.outputs.failed_jobs }}
          - **Commit**: ${{ needs.collect-and-classify.outputs.commit_sha }}

          ### Resolution Checklist

          - [ ] Root cause identified
          - [ ] Fix PR created
          - [ ] Fix verified in CI
          - [ ] Autopilot unfrozen
          - [ ] Post-incident review scheduled

          ---

          > See [AUTOPILOT_FREEZE_MATRIX.md](docs/ops/AUTOPILOT_FREEZE_MATRIX.md) for freeze policy details.
          FREEZE_ISSUE_EOF
          )" \
            --label "autopilot-frozen" \
            --label "ci-failed" \
            --label "ci:${{ needs.collect-and-classify.outputs.failure_class }}" \
            --label "severity:${{ needs.collect-and-classify.outputs.severity }}"

  # ==========================================================================
  # Job 7: Log Freeze Skip (When Feature Flag Disabled)
  # ==========================================================================
  log-freeze-skip:
    name: Log Freeze Skip
    runs-on: ubuntu-latest
    needs: collect-and-classify
    # Log when freeze would have triggered but feature is disabled
    if: |
      needs.collect-and-classify.outputs.autopilot_freeze_enabled != 'true' &&
      (needs.collect-and-classify.outputs.failure_class == 'MIGRATION' ||
       needs.collect-and-classify.outputs.failure_class == 'SECURITY' ||
       needs.collect-and-classify.outputs.failure_class == 'POLICY')
    steps:
      - name: Log freeze would have triggered
        run: |
          echo "::warning::Autopilot freeze would have been triggered but AUTOPILOT_FREEZE_ENABLED=false"
          echo "Failure Class: ${{ needs.collect-and-classify.outputs.failure_class }}"
          echo "Severity: ${{ needs.collect-and-classify.outputs.severity }}"
          echo ""
          echo "To enable autopilot freeze, update runtime_config/ci_automation.json:"
          echo '  "AUTOPILOT_FREEZE_ENABLED": true'
