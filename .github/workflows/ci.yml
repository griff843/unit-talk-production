name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "18"
  PNPM_VERSION: "10.29.3"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Documentation Validation
  docs-validation:
    name: Validate Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate documentation
        run: npm run docs:validate

      - name: Check CLAUDE.md compliance
        run: |
          echo "Checking CLAUDE.md files..."
          find . -name "CLAUDE.md" -type f | while read file; do
            echo "Validating: $file"
            if ! grep -q "Development Commands" "$file"; then
              echo "❌ Missing 'Development Commands' section in $file"
              exit 1
            fi
          done

  # Smart Form Compliance Gates (HARDENED)
  # PHASE 1: Run static gates (no HAR required)
  # PHASE 2: Run E2E tests to generate HAR
  # PHASE 3: Run runtime-audit gate with HAR
  smart-form-gates:
    name: Smart Form V1.1 Compliance Gates (HARDENED)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/smart-form

      # PHASE 1: Run static gates (7 gates that don't require HAR)
      - name: Run Static Gates (7/8)
        run: pnpm --filter unit-talk-smart-form run smartform:gates:static
        env:
          NODE_ENV: test

      # PHASE 2 & 3: E2E Runtime Audit (requires Supabase credentials)
      # Skipped in PRs without secrets - static gates (7/8) provide compliance
      - name: Run E2E Runtime Audit (HAR capture)
        if: env.NEXT_PUBLIC_SUPABASE_URL != ''
        run: |
          pnpm --filter unit-talk-smart-form build
          npx playwright test tests/e2e/integration/runtime-audit.spec.ts --project=integration
        working-directory: apps/smart-form
        env:
          NODE_ENV: test
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Run Runtime Audit Gate (HAR-derived)
        if: env.NEXT_PUBLIC_SUPABASE_URL != ''
        run: pnpm --filter unit-talk-smart-form run smartform:gate:runtime-audit
        env:
          NODE_ENV: test
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

      - name: Upload HAR + request log + proof artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smart-form-runtime-audit
          path: |
            apps/smart-form/test-results/runtime-audit.har
            apps/smart-form/test-results/runtime-audit.requests.jsonl
            apps/smart-form/out/sprints/**/proofs/proof_runtime_*.txt
          retention-days: 7

      - name: Upload gate results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smart-form-gate-results
          path: apps/smart-form/gate-results/
          retention-days: 7

  # Quality Checks
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: [smart-form-gates]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint code
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run type-check

      - name: Security audit
        run: npm audit --audit-level high

      # SPRINT-SCHEMA-ENV-GATES-002: CI-enforced guards
      - name: Guard - Env Proliferation (strict, monorepo-wide)
        run: npm run guard:env

      - name: Guard - Schema Types Generation
        run: npm run schema:types:gen

      - name: Guard - Schema Drift Check
        run: npm run schema:check-drift

      # SPRINT-DATABASE-TYPE-CENTRALIZATION-003: DB type drift guard
      - name: Guard - DB Type Drift
        run: npm run guard:db-type-drift:strict

  # Lifecycle Contract Gate
  # LIFECYCLE-WRITE-SURFACE-MIGRATION-038: Enforce single-writer discipline
  lifecycle-gate:
    name: Lifecycle Contract Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run Lifecycle Single-Writer Gate
        run: pnpm run lifecycle:single-writer
        working-directory: apps/api
        env:
          NODE_ENV: test

      - name: Run Lifecycle Contract Tests
        run: pnpm run lifecycle:test
        working-directory: apps/api
        env:
          NODE_ENV: test

      - name: Run Lifecycle Idempotency Tests
        run: npx vitest run src/lib/lifecycle/__tests__/idempotency.test.ts --reporter=verbose
        working-directory: apps/api
        env:
          NODE_ENV: test

  # E2E Smoke Test Verification
  # Sprint: SPRINT-E2E-SMOKE-AUTOMATION-005
  # Verifies smoke test script compiles and can run structure checks
  # Full smoke test against staging requires separate deployment workflow
  smoke-test-verify:
    name: E2E Smoke Test Verification
    runs-on: ubuntu-latest
    needs: [lifecycle-gate]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build shared-utils (required for smoke test)
        run: npm run build --workspace=@unit-talk/shared-utils

      - name: Type-check smoke test script
        run: npx tsc --noEmit scripts/e2e-smoke/run-full-smoke.ts
        env:
          NODE_ENV: test

      - name: Verify smoke test structure
        run: |
          echo "✅ Smoke test script type-checks successfully"
          echo "✅ Ready for staging/integration runs"
          echo "NOTE: Full smoke test requires SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY"

  # Test Suite
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: [lifecycle-gate, smoke-test-verify]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run unit tests
        run: npm run test:unit
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379

      - name: Run integration tests
        run: npm run test:integration
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379

      - name: Generate coverage report
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: unit-talk-coverage

  # Build Applications
  build:
    name: Build Applications
    runs-on: ubuntu-latest
    needs: [docs-validation, code-quality, test, lifecycle-gate]
    strategy:
      matrix:
        app: [api, discord-bot, dashboard, smart-form, command-center]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build ${{ matrix.app }}
        run: npm run build --workspace=apps/${{ matrix.app }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-build
          path: apps/${{ matrix.app }}/dist/
          retention-days: 7

  # Security Scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: "trivy-results.sarif"

      - name: Dependency vulnerability check
        run: |
          npx audit-ci --high --report-type summary

  # Performance Testing
  performance:
    name: Performance Testing
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run performance tests
        run: npm run test:performance

      - name: Performance regression check
        run: |
          echo "Checking for performance regressions..."
          # Add performance regression detection logic

  # E2E Testing
  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7

  # Deployment readiness check
  deployment-check:
    name: Deployment Readiness
    runs-on: ubuntu-latest
    needs: [security, performance, e2e]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check deployment readiness
        run: |
          echo "✅ All quality gates passed"
          echo "✅ Security scan completed"
          echo "✅ Performance tests passed"
          echo "✅ E2E tests passed"
          echo "🚀 Ready for deployment"

      - name: Create deployment artifact
        run: |
          echo "deployment_ready=true" >> $GITHUB_ENV
          echo "deployment_commit=${{ github.sha }}" >> $GITHUB_ENV

      - name: Notify deployment readiness
        run: |
          echo "Deployment ready for commit: ${{ github.sha }}"
