name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "18"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Foundation Guardrails (fail-closed)
  foundation-guardrails:
    name: Foundation Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for legacy Supabase project refs
        run: |
          echo "🔍 Checking for legacy Supabase project references..."

          # Define known legacy project refs to block
          LEGACY_REFS=(
            "xyzcompany"
            "old-project-ref"
          )

          # Check for any hardcoded Supabase URLs with project refs
          if grep -rE "[a-z0-9]{20}\.supabase\.co" apps/ packages/ scripts/ config/ --include="*.ts" --include="*.tsx" --include="*.js" --include="*.json" 2>/dev/null | grep -v "your-project" | grep -v "example" | grep -v ".example"; then
            echo "❌ FAIL: Found hardcoded Supabase project URLs in source code"
            echo "All Supabase URLs must use environment variables"
            exit 1
          fi

          echo "✅ No legacy Supabase project refs found"

      - name: Check for hardcoded supabase.co URLs in apps/packages
        run: |
          echo "🔍 Checking for hardcoded *.supabase.co URLs..."

          # Check apps/ and packages/ for hardcoded URLs (excluding docs placeholders)
          FOUND=$(grep -rE "https://[a-zA-Z0-9-]+\.supabase\.co" apps/ packages/ --include="*.ts" --include="*.tsx" --include="*.js" 2>/dev/null | grep -v "your-project" | grep -v "example" | grep -v "placeholder" || true)

          if [ -n "$FOUND" ]; then
            echo "❌ FAIL: Found hardcoded Supabase URLs in apps/ or packages/:"
            echo "$FOUND"
            echo ""
            echo "All Supabase URLs must be loaded from SUPABASE_URL environment variable"
            exit 1
          fi

          echo "✅ No hardcoded Supabase URLs in apps/packages"

      - name: Validate canary env vars in CI (staging environment)
        run: |
          echo "🔍 Validating canary channel configuration..."

          # Check if this is a staging/canary deployment context
          if [ "$CANARY_MODE" = "true" ]; then
            echo "CANARY_MODE is enabled, validating required channel IDs..."

            MISSING=""

            if [ -z "$DISCORD_CANARY_PUBLISH_CHANNEL_ID" ]; then
              MISSING="$MISSING DISCORD_CANARY_PUBLISH_CHANNEL_ID"
            fi

            if [ -z "$DISCORD_CANARY_DEBUG_CHANNEL_ID" ]; then
              MISSING="$MISSING DISCORD_CANARY_DEBUG_CHANNEL_ID"
            fi

            if [ -z "$DISCORD_CANARY_ALERTS_CHANNEL_ID" ]; then
              MISSING="$MISSING DISCORD_CANARY_ALERTS_CHANNEL_ID"
            fi

            if [ -n "$MISSING" ]; then
              echo "❌ FAIL: CANARY_MODE=true but missing required env vars:$MISSING"
              echo "These must be set as GitHub Variables (not Secrets) for staging environment"
              exit 1
            fi

            echo "✅ All required canary channel IDs configured"
          else
            echo "ℹ️ CANARY_MODE not enabled, skipping canary validation"
          fi
        env:
          CANARY_MODE: ${{ vars.CANARY_MODE }}
          DISCORD_CANARY_PUBLISH_CHANNEL_ID: ${{ vars.DISCORD_CANARY_PUBLISH_CHANNEL_ID }}
          DISCORD_CANARY_DEBUG_CHANNEL_ID: ${{ vars.DISCORD_CANARY_DEBUG_CHANNEL_ID }}
          DISCORD_CANARY_ALERTS_CHANNEL_ID: ${{ vars.DISCORD_CANARY_ALERTS_CHANNEL_ID }}

      - name: Verify DISCORD_BOT_TOKEN is secret (not variable)
        run: |
          echo "🔍 Verifying secrets classification..."

          # Check that DISCORD_BOT_TOKEN is available as secret (if set)
          if [ -n "$DISCORD_BOT_TOKEN_FROM_VAR" ]; then
            echo "⚠️ WARNING: DISCORD_BOT_TOKEN found in GitHub Variables"
            echo "This should be a SECRET, not a Variable"
            echo "Please move it to repository Secrets"
          fi

          echo "✅ Secrets classification check complete"
        env:
          DISCORD_BOT_TOKEN_FROM_VAR: ${{ vars.DISCORD_BOT_TOKEN }}

      - name: Check Dockerfile reproducibility (npm ci enforcement)
        run: |
          echo "🔍 Checking Dockerfiles for reproducible builds..."

          # Check that all Dockerfiles use npm ci, not npm install
          DOCKERFILES=$(find . -name "Dockerfile*" -not -path "./node_modules/*" -not -path "./.git/*")
          VIOLATIONS=""

          for dockerfile in $DOCKERFILES; do
            echo "Checking: $dockerfile"

            # Look for npm install that is NOT in a comment
            # Match lines that have "npm install" but don't start with #
            if grep -E "^\s*RUN.*npm\s+install" "$dockerfile" 2>/dev/null | grep -v "^#" | grep -v "# "; then
              echo "❌ VIOLATION: $dockerfile uses 'npm install' instead of 'npm ci'"
              VIOLATIONS="$VIOLATIONS $dockerfile"
            fi
          done

          if [ -n "$VIOLATIONS" ]; then
            echo ""
            echo "❌ FAIL: The following Dockerfiles use 'npm install' instead of 'npm ci':"
            echo "$VIOLATIONS"
            echo ""
            echo "For reproducible builds, all Dockerfiles MUST use 'npm ci' with package-lock.json"
            echo "See: out/repro_build_fix/2026-01-23/01_INVENTORY.md for the correct pattern"
            exit 1
          fi

          echo "✅ All Dockerfiles use npm ci for reproducible builds"

      - name: Verify root lockfile exists
        run: |
          echo "🔍 Verifying package-lock.json exists at root..."

          if [ ! -f "package-lock.json" ]; then
            echo "❌ FAIL: package-lock.json not found at repository root"
            echo "This file is REQUIRED for reproducible npm ci builds"
            exit 1
          fi

          echo "✅ package-lock.json exists at root"

      - name: Generate guardrails report
        run: |
          echo "📋 Foundation Guardrails Summary"
          echo "================================"
          echo "✅ Legacy Supabase refs: PASS"
          echo "✅ Hardcoded URLs: PASS"
          echo "✅ Canary env validation: PASS"
          echo "✅ Secrets classification: PASS"
          echo "✅ Dockerfile reproducibility: PASS"
          echo "✅ Root lockfile exists: PASS"
          echo ""
          echo "🛡️ Foundation guardrails passed"

  # Documentation Validation
  docs-validation:
    name: Validate Documentation
    runs-on: ubuntu-latest
    needs: [foundation-guardrails]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate documentation
        run: npm run docs:validate

      - name: Check CLAUDE.md compliance
        run: |
          echo "Checking CLAUDE.md files..."
          find . -name "CLAUDE.md" -type f | while read file; do
            echo "Validating: $file"
            if ! grep -q "Development Commands" "$file"; then
              echo "❌ Missing 'Development Commands' section in $file"
              exit 1
            fi
          done

  # Quality Checks
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: [foundation-guardrails]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run type-check

      - name: Security audit
        run: npm audit --audit-level high

  # Test Suite
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379

      - name: Run integration tests
        run: npm run test:integration
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379

      - name: Generate coverage report
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: unit-talk-coverage

  # Build Applications
  build:
    name: Build Applications
    runs-on: ubuntu-latest
    needs: [foundation-guardrails, docs-validation, code-quality, test]
    strategy:
      matrix:
        app: [api, discord-bot, dashboard, smart-form, command-center]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.app }}
        run: npm run build --workspace=apps/${{ matrix.app }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.app }}-build
          path: apps/${{ matrix.app }}/dist/
          retention-days: 7

  # Security Scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: "trivy-results.sarif"

      - name: Dependency vulnerability check
        run: |
          npx audit-ci --high --report-type summary

  # Performance Testing
  performance:
    name: Performance Testing
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run performance tests
        run: npm run test:performance

      - name: Performance regression check
        run: |
          echo "Checking for performance regressions..."
          # Add performance regression detection logic

  # E2E Testing
  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload E2E test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7

  # Deployment readiness check
  deployment-check:
    name: Deployment Readiness
    runs-on: ubuntu-latest
    needs: [security, performance, e2e]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check deployment readiness
        run: |
          echo "✅ All quality gates passed"
          echo "✅ Security scan completed"
          echo "✅ Performance tests passed"
          echo "✅ E2E tests passed"
          echo "🚀 Ready for deployment"

      - name: Create deployment artifact
        run: |
          echo "deployment_ready=true" >> $GITHUB_ENV
          echo "deployment_commit=${{ github.sha }}" >> $GITHUB_ENV

      - name: Notify deployment readiness
        run: |
          echo "Deployment ready for commit: ${{ github.sha }}"
