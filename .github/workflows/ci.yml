# ============================================================================
# CI Pipeline — Main CI workflow
# SPRINT-CI-MASTER-TEMPLATE-LOCK-003
#
# Standardized jobs call _ci-core.yml (single source of truth).
# Jobs with service containers or matrix strategy are exempt.
# See scripts/ci/guard-ci-core-usage.mjs for enforcement.
# ============================================================================
name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  # Legacy env vars for exempt jobs only — CI Core pins its own versions
  NODE_VERSION: "20"
  PNPM_VERSION: "10.29.3"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ══════════════════════════════════════════════════════════════════════
  # CI Core Guard — Prevent bypass of CI Core
  # ══════════════════════════════════════════════════════════════════════
  guard-ci-core:
    name: CI Core Usage Guard
    runs-on: ubuntu-latest
    # ci-core-exempt: Guard script must run standalone to validate CI Core usage
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run CI Core usage guard
        run: node scripts/ci/guard-ci-core-usage.mjs

      - name: Run Supabase env guard
        run: node scripts/ci/guard-supabase-env.mjs

  # ══════════════════════════════════════════════════════════════════════
  # Jobs using CI Core (canonical toolchain)
  # ══════════════════════════════════════════════════════════════════════

  # Documentation Validation
  docs-validation:
    name: Validate Documentation
    uses: ./.github/workflows/_ci-core.yml
    with:
      run_docs_validation: true

  # Smart Form Compliance Gates (HARDENED)
  # PHASE 1: Static gates (7/8) — no HAR required
  # PHASE 2: E2E runtime audit — HAR capture (requires Supabase)
  # PHASE 3: Runtime audit gate — HAR-derived
  smart-form-gates:
    name: Smart Form V1.1 Compliance Gates (HARDENED)
    uses: ./.github/workflows/_ci-core.yml
    with:
      environment_name: ci
      run_smartform_static_gates: true
      run_smartform_runtime_audit: true
    secrets: inherit

  # Code Quality (lint, format, type-check, security audit, env guards)
  code-quality:
    name: Code Quality
    needs: [smart-form-gates]
    uses: ./.github/workflows/_ci-core.yml
    with:
      run_lint: true
      run_format_check: true
      run_typecheck: true
      run_security_audit: true
      run_env_guards: true

  # Quarantine Enforcement Gate
  # QUARANTINE-GOVERNANCE-ENFORCEMENT-006
  quarantine-gate:
    name: Quarantine Enforcement Gate
    uses: ./.github/workflows/_ci-core.yml
    with:
      run_quarantine_gate: true

  # Lifecycle Contract Gate
  # LIFECYCLE-WRITE-SURFACE-MIGRATION-038
  lifecycle-gate:
    name: Lifecycle Contract Gate
    uses: ./.github/workflows/_ci-core.yml
    with:
      run_lifecycle_gate: true

  # E2E Smoke Test Verification
  # Sprint: SPRINT-E2E-SMOKE-AUTOMATION-005
  smoke-test-verify:
    name: E2E Smoke Test Verification
    needs: [lifecycle-gate]
    uses: ./.github/workflows/_ci-core.yml
    with:
      run_tests: smoke

  # R3 Shadow Divergence Guardrails
  # SPRINT-LAYER1-PHASE5-E2E-CLOSURE: Layer 1 / Phase 5 closure gate
  # Uses fixture mode — no Supabase required. All 7 acceptance gates must pass.
  shadow-guardrails:
    name: R3 Shadow Divergence Guardrails
    needs: [lifecycle-gate]
    uses: ./.github/workflows/_ci-core.yml
    with:
      run_shadow_guardrails: true

  # R4 Fault Injection Suite
  # SPRINT-LAYER1-PHASE5-E2E-CLOSURE: Layer 1 / Phase 5 closure gate
  # All 10 fault scenarios (F1–F10) with 4 assertions each. All must pass.
  fault-suite:
    name: R4 Fault Injection Suite (F1–F10)
    needs: [lifecycle-gate]
    uses: ./.github/workflows/_ci-core.yml
    with:
      run_fault_suite: true

  # ══════════════════════════════════════════════════════════════════════
  # Exempt jobs (service containers / matrix / special tools)
  # See EXEMPT_JOBS in scripts/ci/guard-ci-core-usage.mjs
  # ══════════════════════════════════════════════════════════════════════

  # Test Suite — ci-core-exempt: Requires postgres + redis service containers
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: [quarantine-gate, lifecycle-gate, smoke-test-verify]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # ci-core-exempt: Requires postgres + redis service containers

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build shared packages
        run: |
          pnpm --filter @unit-talk/shared-types build
          pnpm --filter @unit-talk/shared-utils build
          pnpm --filter @unit-talk/config build

      - name: Run unit tests
        run: npm run test:unit
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379

      - name: Run integration tests
        run: npm run test:integration
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379

      - name: Generate coverage report
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: unit-talk-coverage

  # Build Applications — ci-core-exempt: Uses matrix strategy across 5 apps
  build:
    name: Build Applications
    runs-on: ubuntu-latest
    needs: [docs-validation, code-quality, test, lifecycle-gate]
    strategy:
      matrix:
        app: [api, discord-bot, dashboard, smart-form, command-center]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # ci-core-exempt: Uses matrix strategy across 5 apps

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build shared packages (workspace prereqs)
        run: |
          pnpm --filter @unit-talk/shared-types build
          pnpm --filter @unit-talk/shared-utils build
          pnpm --filter @unit-talk/config build

      - name: Build ${{ matrix.app }}
        run: pnpm --filter apps/${{ matrix.app }} build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-build
          path: apps/${{ matrix.app }}/dist/
          retention-days: 7

  # Security Scanning (no Node/pnpm setup — uses Trivy)
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: "trivy-results.sarif"

      - name: Dependency vulnerability check
        run: |
          pnpm exec audit-ci --high --report-type summary

  # Performance Testing — ci-core-exempt: PR-only, custom performance tests
  performance:
    name: Performance Testing
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # ci-core-exempt: PR-only job with custom performance test runner

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run performance tests
        run: npm run test:performance

      - name: Performance regression check
        run: |
          echo "Checking for performance regressions..."

  # E2E Testing — ci-core-exempt: PR-only, full Playwright browser install
  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # ci-core-exempt: PR-only job with full Playwright E2E suite

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7

  # Deployment readiness check (no Node/pnpm setup)
  deployment-check:
    name: Deployment Readiness
    runs-on: ubuntu-latest
    needs: [security, performance, e2e]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check deployment readiness
        run: |
          echo "✅ All quality gates passed"
          echo "✅ Security scan completed"
          echo "✅ Performance tests passed"
          echo "✅ E2E tests passed"
          echo "🚀 Ready for deployment"

      - name: Create deployment artifact
        run: |
          echo "deployment_ready=true" >> $GITHUB_ENV
          echo "deployment_commit=${{ github.sha }}" >> $GITHUB_ENV

      - name: Notify deployment readiness
        run: |
          echo "Deployment ready for commit: ${{ github.sha }}"
