name: Canonical Convergence CI/CD

on:
  push:
    branches: [main, feature/canonical-convergence]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  # ============================================================================
  # PRE-DEPLOY GATES
  # ============================================================================
  pre-deploy-gates:
    name: Pre-Deploy Gates & Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      
      - name: Mask Secrets
        run: |
          echo "::add-mask::${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          echo "::add-mask::${{ secrets.DATABASE_DIRECT_URL }}"
      
      # Gate 1: TypeScript Compilation
      - name: Gate 1 - TypeScript Compilation
        run: |
          echo "🔍 Gate 1: TypeScript Compilation"
          npm run type-check
          echo "✅ TypeScript compilation passed"
      
      # Gate 2: Unit Tests
      - name: Gate 2 - Unit Tests
        run: |
          echo "🔍 Gate 2: Unit Tests"
          npm run test:unit
          echo "✅ Unit tests passed"
      
      # Gate 3: Database Migration Dry-Run
      - name: Gate 3 - Database Migration Dry-Run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_DIRECT_URL }}
        run: |
          echo "🔍 Gate 3: Database Migration Dry-Run"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 --dry-run -f scripts/migrations/2025-01-28_canonical_convergence.sql || true
          echo "✅ Migration dry-run passed"
      
      # Gate 4: Security Scan
      - name: Gate 4 - Security Scan
        run: |
          echo "🔍 Gate 4: Security Scan"
          npm audit --audit-level=high
          echo "✅ Security scan passed"
      
      - name: Upload Gate Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-deploy-gate-results
          path: |
            test-results/
            coverage/
          retention-days: 7

  # ============================================================================
  # E2E VALIDATION
  # ============================================================================
  e2e-validation:
    name: E2E Validation (Canonical)
    runs-on: ubuntu-latest
    needs: pre-deploy-gates
    timeout-minutes: 30
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: unit_talk_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Setup Environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
        run: |
          cp .env.example .env
          echo "SUPABASE_URL=$SUPABASE_URL" >> .env
          echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" >> .env
          echo "DATABASE_DIRECT_URL=$DATABASE_DIRECT_URL" >> .env
          echo "PICK_DRIVER=canonical" >> .env
          echo "PUBLISH_MODE=outbox" >> .env
          echo "SHADOW_MODE=true" >> .env
      
      - name: Run Canonical Migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_DIRECT_URL }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/migrations/2025-01-28_canonical_convergence.sql
          psql "$DATABASE_URL" -c "select pg_notify('pgrst','reload schema');"
      
      - name: Build Services
        run: |
          npm run build
      
      - name: Start Services
        run: |
          docker-compose up -d api smart-form
          sleep 15
      
      - name: Run E2E Tests
        run: |
          npm run test:e2e:canonical
      
      - name: Capture SLO Metrics
        if: always()
        run: |
          mkdir -p out/ops/cutover/metrics/100
          npm run capture:slo-metrics
      
      - name: Upload E2E Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-validation-results
          path: |
            out/ops/cutover/metrics/100/
            test-results/
          retention-days: 14
      
      - name: Check SLO Compliance
        run: |
          node scripts/ops/verify-slo-compliance.js
          if [ $? -ne 0 ]; then
            echo "❌ SLO compliance check failed"
            exit 1
          fi
          echo "✅ SLO compliance verified"

  # ============================================================================
  # DEPLOYMENT (Staging/Production)
  # ============================================================================
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    needs: e2e-validation
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    timeout-minutes: 20
    environment: ${{ github.event.inputs.environment || 'staging' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Run Database Migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_DIRECT_URL }}
        run: |
          echo "🚀 Running canonical convergence migration..."
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/migrations/2025-01-28_canonical_convergence.sql
          psql "$DATABASE_URL" -c "select pg_notify('pgrst','reload schema');"
          echo "✅ Migration complete"
      
      - name: Deploy to DOKS (Blue/Green)
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}
        run: |
          echo "🚀 Deploying with blue/green strategy..."
          kubectl apply -f k8s/canonical-picks-deployment.yaml
          kubectl rollout status deployment/api-canonical --timeout=5m
          echo "✅ Deployment complete"
      
      - name: Run Canary Analysis
        run: |
          echo "🔍 Running canary analysis (5% → 25% → 50% → 100%)..."
          node scripts/ops/canary-analysis.js
          echo "✅ Canary analysis passed"
      
      - name: Post-Deploy Validation
        run: |
          echo "🔍 Running post-deploy validation..."
          npm run test:smoke
          echo "✅ Post-deploy validation passed"
      
      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          STATUS="${{ job.status }}"
          COLOR=$([ "$STATUS" == "success" ] && echo "3066993" || echo "15158332")
          curl -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"Canonical Convergence Deployment\",
                \"description\": \"Environment: ${{ github.event.inputs.environment || 'staging' }}\",
                \"color\": $COLOR,
                \"fields\": [
                  {\"name\": \"Status\", \"value\": \"$STATUS\", \"inline\": true},
                  {\"name\": \"Commit\", \"value\": \"${{ github.sha }}\", \"inline\": true},
                  {\"name\": \"Actor\", \"value\": \"${{ github.actor }}\", \"inline\": true}
                ],
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }]
            }"

  # ============================================================================
  # NIGHTLY VALIDATION
  # ============================================================================
  nightly-validation:
    name: Nightly Canonical Validation
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 3 * * *'
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Run Nightly E2E
        env:
          DATABASE_URL: ${{ secrets.DATABASE_DIRECT_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npm run test:e2e:nightly
      
      - name: Upload Nightly Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-validation-${{ github.run_number }}
          path: out/ops/cutover/metrics/100/
          retention-days: 14
      
      - name: Generate Trend Report
        run: |
          node scripts/ops/generate-trend-report.js
      
      - name: Notify on Failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_ALERTS_WEBHOOK }}
        run: |
          curl -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"content\": \"⚠️ Nightly canonical validation failed!\",
              \"embeds\": [{
                \"title\": \"Nightly Validation Failure\",
                \"color\": 15158332,
                \"fields\": [
                  {\"name\": \"Run\", \"value\": \"${{ github.run_number }}\", \"inline\": true},
                  {\"name\": \"URL\", \"value\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}
                ]
              }]
            }"

