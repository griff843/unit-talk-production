name: SGO Roster Sync

on:
  workflow_dispatch:
    inputs:
      sports:
        description: "Sports to sync (comma-separated: NBA,MLB,NFL,NHL)"
        required: true
        default: "NBA,MLB"
      sync_type:
        description: "What to sync"
        required: true
        type: choice
        options:
          - teams
          - players
          - both

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Sync Teams
        if: ${{ inputs.sync_type == 'teams' || inputs.sync_type == 'both' }}
        env:
          SGO_API_KEY: ${{ secrets.SGO_API }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://cqfnsozknjzvyiziwicl.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm exec tsx src/scripts/sgo/sync-teams.ts --sport=${{ inputs.sports }}

      - name: Sync Players
        if: ${{ inputs.sync_type == 'players' || inputs.sync_type == 'both' }}
        env:
          SGO_API_KEY: ${{ secrets.SGO_API }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://cqfnsozknjzvyiziwicl.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm exec tsx src/scripts/sgo/sync-players.ts --sport=${{ inputs.sports }}
