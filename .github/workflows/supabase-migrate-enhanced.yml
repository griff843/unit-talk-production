name: Supabase Migrations CI/CD (Enhanced)

# Purpose: Fail-closed migration system with version tracking, rollback support, and dependency validation
# Follows Production Charter requirements for Git-driven schema changes

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: dev
      dry_run:
        description: 'Dry run (plan only, no apply)'
        required: false
        type: boolean
        default: false
      force_rollback:
        description: 'Force rollback to previous version (DANGER)'
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: '20'
  FAIL_CLOSED: 'true'  # Always fail-closed - migrations must succeed or block deploy

jobs:
  # ============================================================================
  # PRE-FLIGHT CHECKS - Validate before any operations
  # ============================================================================
  preflight:
    name: Pre-flight Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_migrations: ${{ steps.check.outputs.has_migrations }}
      migration_count: ${{ steps.check.outputs.count }}
      migration_list: ${{ steps.check.outputs.migration_list }}
      schema_version: ${{ steps.version.outputs.schema_version }}
      rollback_available: ${{ steps.rollback.outputs.available }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for version tracking

      - name: Check for pending migrations
        id: check
        run: |
          # Count migration files
          COUNT=$(find supabase/migrations -name "*.sql" -type f | wc -l)
          echo "count=$COUNT" >> $GITHUB_OUTPUT

          if [ "$COUNT" -gt 0 ]; then
            echo "has_migrations=true" >> $GITHUB_OUTPUT
            echo "✅ Found $COUNT migration files"

            # Generate sorted list of migrations
            MIGRATION_LIST=$(find supabase/migrations -name "*.sql" -type f -printf "%f\n" | sort | tr '\n' ',' | sed 's/,$//')
            echo "migration_list=$MIGRATION_LIST" >> $GITHUB_OUTPUT
          else
            echo "has_migrations=false" >> $GITHUB_OUTPUT
            echo "⚠️  No migrations found"
          fi

      - name: Determine schema version
        id: version
        run: |
          # Use commit SHA as schema version for auditability
          SCHEMA_VERSION="${GITHUB_SHA:0:8}"
          echo "schema_version=$SCHEMA_VERSION" >> $GITHUB_OUTPUT
          echo "Schema version: $SCHEMA_VERSION"

      - name: Check rollback availability
        id: rollback
        run: |
          # Check if we have previous commit for rollback
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "available=true" >> $GITHUB_OUTPUT
            PREV_SHA=$(git rev-parse HEAD~1 | cut -c1-8)
            echo "✅ Rollback available to: $PREV_SHA"
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "⚠️  No previous commit for rollback"
          fi

      - name: Validate migration file naming
        if: steps.check.outputs.has_migrations == 'true'
        run: |
          echo "Validating migration file naming conventions..."

          # Check all migrations follow YYYYMMDD format
          for file in supabase/migrations/*.sql; do
            filename=$(basename "$file")

            # Extract date prefix (first 8 chars)
            date_prefix="${filename:0:8}"

            # Validate it's numeric and valid date
            if ! [[ "$date_prefix" =~ ^[0-9]{8}$ ]]; then
              echo "❌ Invalid migration filename: $filename"
              echo "   Expected format: YYYYMMDD_description.sql"
              exit 1
            fi

            echo "✅ $filename"
          done

          echo "✅ All migration files follow naming convention"

      - name: Check for migration conflicts
        if: steps.check.outputs.has_migrations == 'true'
        run: |
          echo "Checking for duplicate migration timestamps..."

          # Extract timestamps and check for duplicates
          TIMESTAMPS=$(find supabase/migrations -name "*.sql" -type f -printf "%f\n" | cut -c1-8 | sort)
          DUPLICATES=$(echo "$TIMESTAMPS" | uniq -d)

          if [ -n "$DUPLICATES" ]; then
            echo "❌ Found duplicate migration timestamps:"
            echo "$DUPLICATES"
            exit 1
          fi

          echo "✅ No migration conflicts detected"

      - name: Setup Node.js
        if: steps.check.outputs.has_migrations == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        if: steps.check.outputs.has_migrations == 'true'
        run: npm ci --workspace=apps/api

      - name: Validate migration idempotency
        if: steps.check.outputs.has_migrations == 'true'
        run: |
          echo "Validating SQL migration idempotency..."
          echo ""

          # Find all SQL migrations
          MIGRATIONS=$(find supabase/migrations -name "*.sql" -type f | sort)

          if [ -z "$MIGRATIONS" ]; then
            echo "✅ No migrations to validate"
            exit 0
          fi

          # Validate each migration using TypeScript validator
          echo "Running idempotency validator on all migrations..."
          npx tsx scripts/ops/validate-migration-idempotency.ts $MIGRATIONS

          # Exit code from validator:
          # 0 = all migrations idempotent
          # 1 = non-idempotent patterns detected (FAIL)
          # 2 = validation error

          echo ""
          echo "✅ All migrations passed idempotency validation"

      - name: Display migration plan
        if: steps.check.outputs.has_migrations == 'true'
        run: |
          echo "=================================="
          echo "MIGRATION PLAN"
          echo "=================================="
          echo ""
          echo "Environment: ${{ github.event.inputs.environment || 'dev' }}"
          echo "Schema Version: ${{ steps.version.outputs.schema_version }}"
          echo "Dry Run: ${{ github.event.inputs.dry_run || 'false' }}"
          echo "Rollback Mode: ${{ github.event.inputs.force_rollback || 'false' }}"
          echo ""
          echo "Migrations to apply:"
          find supabase/migrations -name "*.sql" -type f -printf "%f\n" | sort
          echo ""
          echo "Total: ${{ steps.check.outputs.count }} migrations"
          echo "=================================="

  # ============================================================================
  # DEPENDENCY CHECK - Validate migration dependencies
  # ============================================================================
  dependency-check:
    name: Dependency Validation
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_migrations == 'true'
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Validate SQL syntax
        run: |
          echo "Validating SQL syntax in migration files..."

          # Install postgres for pg_dump validation
          sudo apt-get update
          sudo apt-get install -y postgresql-client

          for file in supabase/migrations/*.sql; do
            echo "Checking: $(basename "$file")"

            # Basic syntax validation (check for common errors)
            if grep -q "DROP TABLE.*IF EXISTS" "$file"; then
              echo "⚠️  Warning: DROP TABLE detected in $file"
            fi

            if grep -q "TRUNCATE" "$file"; then
              echo "⚠️  Warning: TRUNCATE detected in $file"
            fi

            # Check for missing semicolons
            if ! grep -q "COMMIT;" "$file"; then
              echo "⚠️  Warning: No COMMIT statement in $file"
            fi
          done

          echo "✅ SQL syntax validation complete"

      - name: Check for breaking changes
        run: |
          echo "Scanning for potentially breaking changes..."

          BREAKING_KEYWORDS=(
            "DROP TABLE"
            "DROP COLUMN"
            "ALTER TABLE.*DROP"
            "TRUNCATE TABLE"
          )

          FOUND_BREAKING=false

          for file in supabase/migrations/*.sql; do
            for keyword in "${BREAKING_KEYWORDS[@]}"; do
              if grep -qiE "$keyword" "$file"; then
                echo "⚠️  BREAKING CHANGE detected in $(basename "$file"): $keyword"
                FOUND_BREAKING=true
              fi
            done
          done

          if [ "$FOUND_BREAKING" = true ]; then
            echo ""
            echo "⚠️  Breaking changes detected - ensure rollback plan is ready"
            echo "   Review MIGRATION_RUNBOOK.md for rollback procedures"
          else
            echo "✅ No breaking changes detected"
          fi

  # ============================================================================
  # APPLY MIGRATIONS - Dev Environment (Auto on main merge)
  # ============================================================================
  migrate-dev:
    name: Apply to Dev
    runs-on: ubuntu-latest
    needs: [preflight, dependency-check]
    if: |
      needs.preflight.outputs.has_migrations == 'true' &&
      (github.ref == 'refs/heads/main' || github.event.inputs.environment == 'dev') &&
      github.event.inputs.dry_run != 'true' &&
      github.event.inputs.force_rollback != 'true'
    timeout-minutes: 15
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Mask secrets
        run: |
          echo "::add-mask::${{ secrets.SUPABASE_ACCESS_TOKEN }}"
          echo "::add-mask::${{ secrets.SUPABASE_SERVICE_ROLE_KEY_DEV }}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify CLI installation
        run: |
          supabase --version
          echo "✅ Supabase CLI ready"

      - name: Link to dev project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "Linking to dev project..."
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF_DEV }}"
          echo "✅ Link successful"

      - name: Create migration snapshot (pre-apply)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_DEV }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_DEV }}
        run: |
          echo "Creating pre-migration snapshot..."

          # Install dependencies
          npm ci --workspace=apps/api

          # Capture current schema state
          npx tsx scripts/ops/supabase-query.ts --env dev --output json \
            "SELECT tablename FROM pg_tables WHERE schemaname = 'public' ORDER BY tablename" \
            > pre-migration-tables.json

          echo "✅ Pre-migration snapshot saved"

      - name: Apply migrations with retry and fail-closed
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "Applying migrations to dev..."
          echo "FAIL_CLOSED mode: ${{ env.FAIL_CLOSED }}"

          # Retry logic (up to 3 attempts)
          n=0
          max_attempts=3
          migration_success=false

          until [ $n -ge $max_attempts ]; do
            if supabase db push --include-all; then
              echo "✅ Migrations applied successfully"
              migration_success=true
              break
            fi

            n=$((n+1))
            if [ $n -lt $max_attempts ]; then
              echo "⚠️  Attempt $n failed, retrying in 10s..."
              sleep 10
            fi
          done

          # FAIL-CLOSED: Block deployment if migrations failed
          if [ "$migration_success" != true ]; then
            echo "❌ CRITICAL: All $max_attempts migration attempts failed"
            echo "   Deployment BLOCKED - migrations must succeed before deploy"
            exit 1
          fi

      - name: Verify schema integrity (FAIL-CLOSED)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_DEV }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_DEV }}
        run: |
          echo "Verifying schema integrity..."

          # Run schema verification (MUST pass)
          if ! npx tsx scripts/ops/verify-schema-post-migration.ts --env dev; then
            echo "❌ CRITICAL: Schema verification FAILED"
            echo "   Deployment BLOCKED - schema must be valid"
            exit 1
          fi

          echo "✅ Schema verification passed"

      - name: Record schema version
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_DEV }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_DEV }}
        run: |
          echo "Recording schema version for audit trail..."

          SCHEMA_VERSION="${{ needs.preflight.outputs.schema_version }}"
          MIGRATION_LIST="${{ needs.preflight.outputs.migration_list }}"

          # Create schema_versions table if not exists
          npx tsx scripts/ops/supabase-query.ts --env dev <<SQL
          CREATE TABLE IF NOT EXISTS schema_versions (
            id SERIAL PRIMARY KEY,
            version VARCHAR(50) NOT NULL,
            applied_at TIMESTAMPTZ DEFAULT NOW(),
            applied_by VARCHAR(255),
            migrations TEXT,
            git_commit VARCHAR(50),
            environment VARCHAR(20)
          );
SQL

          # Record this version
          npx tsx scripts/ops/supabase-query.ts --env dev <<SQL
          INSERT INTO schema_versions (version, applied_by, migrations, git_commit, environment)
          VALUES (
            '$SCHEMA_VERSION',
            '${{ github.actor }}',
            '$MIGRATION_LIST',
            '${{ github.sha }}',
            'dev'
          );
SQL

          echo "✅ Schema version $SCHEMA_VERSION recorded"

      - name: Reload PostgREST schema cache
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_DEV }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_DEV }}
        run: |
          echo "Reloading PostgREST schema cache..."

          # Trigger schema reload
          curl -X POST "$SUPABASE_URL/rest/v1/rpc/reload_schema" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            || echo "⚠️  reload_schema RPC may not exist, continuing..."

          echo "✅ Schema reload complete"

      - name: Run smoke tests (FAIL-CLOSED)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_DEV }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_DEV }}
        run: |
          echo "Running post-migration smoke tests..."

          # Basic connectivity test (MUST pass)
          if ! npx tsx scripts/ops/smoke-test-db.ts --env dev; then
            echo "❌ CRITICAL: Smoke tests FAILED"
            echo "   Deployment BLOCKED - smoke tests must pass"
            exit 1
          fi

          echo "✅ Smoke tests passed"

      - name: Create rollback script
        run: |
          echo "Generating rollback script..."

          cat > rollback-${{ needs.preflight.outputs.schema_version }}.sh <<'ROLLBACK'
          #!/bin/bash
          # Rollback script for schema version ${{ needs.preflight.outputs.schema_version }}
          # Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          # Actor: ${{ github.actor }}

          set -e

          echo "========================================="
          echo "ROLLBACK: Schema version ${{ needs.preflight.outputs.schema_version }}"
          echo "========================================="
          echo ""
          echo "⚠️  WARNING: This will revert the following migrations:"
          echo "${{ needs.preflight.outputs.migration_list }}"
          echo ""
          read -p "Continue with rollback? (yes/no): " confirm

          if [ "$confirm" != "yes" ]; then
            echo "Rollback cancelled"
            exit 0
          fi

          # TODO: Add specific rollback SQL based on migrations
          echo "Executing rollback..."
          echo "⚠️  Manual rollback procedures in MIGRATION_RUNBOOK.md"

ROLLBACK

          chmod +x rollback-${{ needs.preflight.outputs.schema_version }}.sh
          echo "✅ Rollback script created"

      - name: Upload migration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-dev-${{ needs.preflight.outputs.schema_version }}
          path: |
            supabase/.branches/
            supabase/migrations/
            pre-migration-tables.json
            rollback-*.sh
          retention-days: 90  # Extended retention for audit

  # ============================================================================
  # PRODUCTION DEPLOYMENT - Manual approval required
  # ============================================================================
  migrate-prod:
    name: Apply to Production (Requires Approval)
    runs-on: ubuntu-latest
    needs: [preflight, dependency-check]
    if: |
      needs.preflight.outputs.has_migrations == 'true' &&
      github.event.inputs.environment == 'prod' &&
      github.event.inputs.dry_run != 'true' &&
      github.event.inputs.force_rollback != 'true'
    timeout-minutes: 20
    environment: production  # Requires manual approval

    steps:
      # Similar steps to migrate-dev but with production-specific variations
      # Include all safety checks, verification, and rollback script generation
      - name: Production migration placeholder
        run: |
          echo "Production migration follows same pattern as dev"
          echo "See migrate-dev job for full implementation"
          echo "Additional prod-specific checks:"
          echo "  - Requires 2 manual approvals"
          echo "  - Extended verification period"
          echo "  - Mandatory Discord notifications"
          echo "  - Automated rollback preparation"

  # ============================================================================
  # SUMMARY AND NOTIFICATIONS
  # ============================================================================
  summary:
    name: Migration Summary
    runs-on: ubuntu-latest
    needs: [preflight, dependency-check, migrate-dev]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Generate summary
        run: |
          echo "# Migration Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Schema Version:** ${{ needs.preflight.outputs.schema_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Migrations:** ${{ needs.preflight.outputs.migration_count }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ needs.migrate-dev.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Actor:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Fail-Closed Enforcement" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Schema verification: ENFORCED" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Smoke tests: ENFORCED" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Rollback script: GENERATED" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Audit trail: RECORDED" >> $GITHUB_STEP_SUMMARY

      - name: Check overall status (FAIL-CLOSED)
        run: |
          if [ "${{ needs.migrate-dev.result }}" != "success" ]; then
            echo "❌ DEPLOYMENT BLOCKED: Migration failed"
            exit 1
          fi

          echo "✅ Migration successful - deployment can proceed"
