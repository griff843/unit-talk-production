name: E2E CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch: {}

jobs:
  verify-e2e:
    name: Supabase migrate → admin RPCs → Gates → SLOs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Mask secrets
        run: |
          echo "::add-mask::${{ secrets.SUPABASE_ACCESS_TOKEN }}"
          echo "::add-mask::${{ secrets.SUPABASE_SERVICE_ROLE_KEY_2 }}"

      # ✅ Reliable CLI install (replaces curl; handles DNS/retries)
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Show Supabase CLI version
        run: supabase --version

      - name: Supabase login & link
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

          # Repair migration history to handle preview drift
          # This marks phantom migrations as reverted so db push can proceed
          echo "Checking for migration history drift..."
          supabase migration list 2>&1 | grep -E "^[0-9]+" | while read migration_id rest; do
            if [ ! -f "supabase/migrations/${migration_id}"*.sql ]; then
              echo "Repairing phantom migration: $migration_id"
              supabase migration repair --status reverted "$migration_id" || true
            fi
          done

          # Push migrations with proper failure handling
          echo "Pushing migrations..."
          push_success=false
          for attempt in 1 2 3; do
            if supabase db push 2>&1; then
              echo "Migration push succeeded on attempt $attempt"
              push_success=true
              break
            fi
            echo "Push attempt $attempt failed, retrying..."
            sleep 5
          done

          if [ "$push_success" = "false" ]; then
            echo "ERROR: Migration push failed after 3 attempts"
            exit 1
          fi

      - name: Run admin RPCs (backfill → score loop → refresh)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_new }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_2 }}
        run: npx tsx apps/api/src/scripts/ci-run-admin-rpcs.ts

      - name: Verify gates (must hard-fail on red)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_new }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_2 }}
        run: npx tsx apps/api/src/scripts/verify-gates.ts

      - name: Verify SLOs (must hard-fail on breach)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_new }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_2 }}
        run: npx tsx apps/api/src/scripts/verify-slo.ts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            apps/api/out/ops/verify/**
          if-no-files-found: warn
