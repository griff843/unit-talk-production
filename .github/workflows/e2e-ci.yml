# ============================================================================
# E2E CI Pipeline — Wrapper calling CI Core
# SPRINT-CI-MASTER-TEMPLATE-LOCK-003
#
# CI-TRUTH-UNBLOCK-005: E2E requires Supabase secrets
# For forked PRs (no secrets), this job will skip with clear reason
# For main repo PRs, missing secrets = hard failure (via CI Core enforcement)
# ============================================================================
name: E2E CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch: {}

jobs:
  verify-e2e:
    name: Supabase migrate → admin RPCs → Gates → SLOs
    # Skip for forked PRs (secrets not available)
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/_ci-core.yml
    with:
      environment_name: ci
      requires_supabase: true
      run_supabase_migrate: true
      run_admin_rpcs: true
      run_verify_gates: true
      run_verify_slos: true
    secrets: inherit
