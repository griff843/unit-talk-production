name: E2E CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  SUPABASE_PROJECT_REF: cqfnsozknjzvyiziwicl

jobs:
  e2e-validation:
    name: E2E Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mask secrets
        run: |
          echo "::add-mask::${{ secrets.SUPABASE_ACCESS_TOKEN }}"
          echo "::add-mask::${{ secrets.SUPABASE_SERVICE_ROLE_KEY_2 }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref ${{ env.SUPABASE_PROJECT_REF }}

      - name: Push database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase db push

      - name: Run admin RPCs (backfill, score, refresh)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_new }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_2 }}
        run: |
          npx tsx apps/api/src/scripts/ci-run-admin-rpcs.ts

      - name: Verify gates
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_new }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_2 }}
          STATEMENT_TIMEOUT_MS: 8000
        run: |
          npx tsx apps/api/src/scripts/verify-gates.ts

      - name: Verify SLOs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_new }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_2 }}
          STATEMENT_TIMEOUT_MS: 8000
        run: |
          npx tsx apps/api/src/scripts/verify-slo.ts

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            apps/api/out/ops/**/*.json
            apps/api/out/ops/**/*.md
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            let comment = '## E2E Validation Results\n\n';
            
            try {
              const reportPath = path.join(process.cwd(), 'apps/api/out/ops/verify/E2E_VALIDATION_REPORT.md');
              if (fs.existsSync(reportPath)) {
                const report = fs.readFileSync(reportPath, 'utf8');
                comment += report;
              } else {
                comment += '❌ Report not found\n';
              }
            } catch (error) {
              comment += `❌ Error reading report: ${error.message}\n`;
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

