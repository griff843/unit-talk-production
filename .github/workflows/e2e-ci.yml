name: E2E CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch: {}

jobs:
  verify-e2e:
    name: Supabase migrate → RPC backfill/score/refresh → Gates → SLOs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Mask secrets
        run: |
          echo "::add-mask::${{ secrets.SUPABASE_ACCESS_TOKEN }}"
          echo "::add-mask::${{ secrets.SUPABASE_SERVICE_ROLE_KEY_2 }}"

      - name: Install Supabase CLI
        run: |
          curl -fsSL https://cli.supabase.com/install/linux | sh
          echo "$HOME/.supabase/bin" >> $GITHUB_PATH

      - name: Supabase login & link
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase db push

      - name: Run admin RPCs (backfill → score loop → refresh)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_new }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_2 }}
        run: npx tsx apps/api/src/scripts/ci-run-admin-rpcs.ts

      - name: Verify gates (must hard-fail on red)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_new }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_2 }}
        run: npx tsx apps/api/src/scripts/verify-gates.ts

      - name: Verify SLOs (must hard-fail on breach)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_new }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_2 }}
        run: npx tsx apps/api/src/scripts/verify-slo.ts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            apps/api/out/ops/verify/**
          if-no-files-found: warn
