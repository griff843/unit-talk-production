global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alertmanager@unittalk.com'
  smtp_auth_username: 'alertmanager@unittalk.com'
  smtp_auth_password: 'your_smtp_password'
  
  # Slack global settings
  slack_api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
  
  # PagerDuty global settings
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'


route:
  receiver: 'default'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  
  routes:
    # Critical alerts - immediate paging
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      group_interval: 2m
      repeat_interval: 5m
      
    # High severity alerts - Slack notifications
    - match:
        severity: high
      receiver: 'high-severity-alerts'
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
      
    # SLA violations - immediate escalation
    - match:
        component: sla
      receiver: 'sla-violations'
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 15m
      
    # Security alerts - security team notification
    - match:
        tier: security
      receiver: 'security-alerts'
      group_wait: 15s
      group_interval: 2m
      repeat_interval: 30m
      
    # Infrastructure alerts - ops team
    - match:
        tier: infrastructure
      receiver: 'infrastructure-alerts'
      group_wait: 1m
      group_interval: 5m
      repeat_interval: 2h
      
    # Business logic alerts - development team
    - match:
        tier: business
      receiver: 'business-alerts'
      group_wait: 2m
      group_interval: 10m
      repeat_interval: 4h

inhibit_rules:
  # Inhibit warning alerts if critical alerts are firing for the same service
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance', 'service']
    
  # Inhibit high alerts if critical alerts are firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'high'
    equal: ['alertname', 'instance', 'service']

receivers:
  # Default receiver for uncategorized alerts
  - name: 'default'
    email_configs:
      - to: 'ops@unittalk.com'
          
  # Critical alerts - PagerDuty + Slack + Email
  - name: 'critical-alerts'
    pagerduty_configs:
      - service_key: 'YOUR_PAGERDUTY_SERVICE_KEY'
        client: 'UnitTalk Alertmanager'
        client_url: 'http://localhost:9093'
        description: '{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}'
        details:
          firing: '{{ .Alerts.Firing | len }}'
          resolved: '{{ .Alerts.Resolved | len }}'
          runbook: '{{ .CommonAnnotations.runbook }}'
          
    slack_configs:
      - channel: '#critical-alerts'
        username: 'alertmanager'
        color: 'danger'
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        text: |
          {{ .CommonAnnotations.summary }}
          {{ .CommonAnnotations.description }}
          
          Runbook: {{ .CommonAnnotations.runbook }}
        actions:
          - type: button
            text: 'View in Grafana 📊'
            url: 'http://localhost:3005'
          - type: button
            text: 'Silence 🔇'
            url: '{{ template "slack.default.silenceURL" . }}'
            
    email_configs:
      - to: 'oncall@unittalk.com,engineering@unittalk.com'
          
  # High severity alerts - Slack + Email
  - name: 'high-severity-alerts'
    slack_configs:
      - channel: '#ops-alerts'
        username: 'alertmanager'
        color: 'warning'
        title: '⚠️ HIGH: {{ .GroupLabels.alertname }}'
        text: |
          {{ .CommonAnnotations.summary }}
          {{ .CommonAnnotations.description }}
          
    email_configs:
      - to: 'ops@unittalk.com'
          
  # SLA violation alerts - Executive + Engineering notification
  - name: 'sla-violations'
    slack_configs:
      - channel: '#sla-violations'
        username: 'alertmanager'
        color: 'danger'
        title: '📊 SLA VIOLATION: {{ .GroupLabels.alertname }}'
        text: |
          🚨 SLA BREACH DETECTED 🚨
          {{ .CommonAnnotations.summary }}
          {{ .CommonAnnotations.description }}
          
          Immediate action required to maintain service commitments.
          
    email_configs:
      - to: 'executives@unittalk.com,engineering@unittalk.com,ops@unittalk.com'
          
  # Security alerts - Security team notification
  - name: 'security-alerts'
    slack_configs:
      - channel: '#security-alerts'
        username: 'alertmanager'
        color: 'danger'
        title: '🛡️ SECURITY: {{ .GroupLabels.alertname }}'
        text: |
          Security event detected:
          {{ .CommonAnnotations.summary }}
          {{ .CommonAnnotations.description }}
          
    email_configs:
      - to: 'security@unittalk.com,ops@unittalk.com'
          
  # Infrastructure alerts - Operations team
  - name: 'infrastructure-alerts'
    slack_configs:
      - channel: '#infrastructure'
        username: 'alertmanager'
        color: 'warning'
        title: '🏗️ INFRA: {{ .GroupLabels.alertname }}'
        text: |
          Infrastructure issue detected:
          {{ .CommonAnnotations.summary }}
          {{ .CommonAnnotations.description }}
          
    email_configs:
      - to: 'infrastructure@unittalk.com'
        
  # Business logic alerts - Development team
  - name: 'business-alerts'
    slack_configs:
      - channel: '#dev-alerts'
        username: 'alertmanager'
        color: 'warning'
        title: '💼 BUSINESS: {{ .GroupLabels.alertname }}'
        text: |
          Business logic issue:
          {{ .CommonAnnotations.summary }}
          {{ .CommonAnnotations.description }}
          
    email_configs:
      - to: 'engineering@unittalk.com'

