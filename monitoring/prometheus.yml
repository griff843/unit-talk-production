# Unit Talk Production Monitoring Configuration
# Focus: Application Services for Production Readiness
# Target: 2/2 Application Services UP

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Application Services - Production Targets
  - job_name: "unit-talk-api"
    static_configs:
      - targets: ["api:9464"]
    scrape_interval: 5s
    metrics_path: /metrics

  - job_name: "unit-talk-workers"
    static_configs:
      - targets: ["workers:9465"]
    scrape_interval: 5s
    metrics_path: /metrics
# Infrastructure Services - Future Phase 2 Enhancement
# Requires dedicated exporters (postgres_exporter, redis_exporter, temporal metrics endpoint)
# Removed from active scraping to achieve 2/2 UP target for production readiness
