# NGINX Production Configuration - Phase 8 API Integration Layer
# High-performance load balancer with rate limiting and failover
# Optimized for 1000+ props/hour processing with <2s latency

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Performance optimizations
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
    accept_mutex off;
}

http {
    # ==============================================
    # BASIC CONFIGURATION
    # ==============================================

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format for detailed monitoring
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    # Production logging for performance analysis
    log_format production '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status $bytes_sent '
                         '"$http_referer" "$http_user_agent" '
                         '"$http_x_forwarded_for" "$http_x_real_ip" '
                         'rt=$request_time uct="$upstream_connect_time" '
                         'uht="$upstream_header_time" urt="$upstream_response_time" '
                         'cache="$upstream_cache_status" '
                         'host="$upstream_addr"';

    access_log /var/log/nginx/access.log production;

    # ==============================================
    # PERFORMANCE OPTIMIZATIONS
    # ==============================================

    # File I/O optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # Buffer optimizations for high throughput
    client_body_buffer_size 16K;
    client_header_buffer_size 1k;
    client_max_body_size 8m;
    large_client_header_buffers 4 16k;

    # Timeout optimizations
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # Gzip compression for API responses
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ==============================================
    # RATE LIMITING ZONES
    # ==============================================

    # General API rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

    # Scoring pipeline rate limiting (higher limits for production load)
    limit_req_zone $binary_remote_addr zone=scoring:10m rate=200r/s;

    # Authentication rate limiting (stricter for security)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # Health check rate limiting
    limit_req_zone $binary_remote_addr zone=health:10m rate=10r/s;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

    # ==============================================
    # UPSTREAM BACKEND DEFINITIONS
    # ==============================================

    # Main API backend with failover
    upstream api_backend {
        least_conn;

        # Primary API instances
        server api:3000 max_fails=3 fail_timeout=30s weight=3;

        # Backup API instances (if scaled)
        # server api-backup:3000 backup max_fails=3 fail_timeout=30s;

        # Health check configuration
        keepalive 32;
        keepalive_requests 100;
        keepalive_timeout 60s;
    }

    # Command Center backend
    upstream command_center_backend {
        least_conn;
        server command-center:3000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # Grafana monitoring backend
    upstream grafana_backend {
        server grafana:3000 max_fails=2 fail_timeout=20s;
        keepalive 8;
    }

    # Prometheus metrics backend
    upstream prometheus_backend {
        server prometheus:9090 max_fails=2 fail_timeout=20s;
        keepalive 8;
    }

    # Temporal UI backend
    upstream temporal_ui_backend {
        server temporal-ui:8080 max_fails=2 fail_timeout=20s;
        keepalive 8;
    }

    # ==============================================
    # CACHING CONFIGURATION
    # ==============================================

    # Proxy cache path for API responses
    proxy_cache_path /var/cache/nginx/api
                     levels=1:2
                     keys_zone=api_cache:100m
                     max_size=1g
                     inactive=60m
                     use_temp_path=off;

    # Cache for static assets
    proxy_cache_path /var/cache/nginx/static
                     levels=1:2
                     keys_zone=static_cache:50m
                     max_size=500m
                     inactive=24h
                     use_temp_path=off;

    # ==============================================
    # MAIN API SERVER CONFIGURATION
    # ==============================================

    server {
        listen 80;
        listen [::]:80;
        server_name api.unittalk.com localhost;

        # Security headers
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Rate limiting and connection limits
        limit_req zone=api burst=200 nodelay;
        limit_conn conn_limit_per_ip 20;

        # ==============================================
        # HEALTH CHECK ENDPOINT (HIGH PRIORITY)
        # ==============================================

        location /health {
            limit_req zone=health burst=20 nodelay;

            proxy_pass http://api_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;

            # No caching for health checks
            proxy_cache off;

            access_log /var/log/nginx/health.log main;
        }

        # ==============================================
        # SCORING PIPELINE ENDPOINTS (OPTIMIZED)
        # ==============================================

        location /api/scoring {
            # Higher rate limits for scoring pipeline
            limit_req zone=scoring burst=400 nodelay;

            # Optimized proxy settings for low latency
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Aggressive timeouts for real-time processing
            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 10s;

            # Buffer optimization for scoring pipeline
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;

            # Selective caching for scoring results
            proxy_cache api_cache;
            proxy_cache_valid 200 5m;
            proxy_cache_valid 404 1m;
            proxy_cache_key "$scheme$request_method$host$request_uri$arg_prop_id";
            proxy_cache_bypass $arg_nocache;

            # Cache headers
            add_header X-Cache-Status $upstream_cache_status;

            access_log /var/log/nginx/scoring.log production;
        }

        # ==============================================
        # AUTHENTICATION ENDPOINTS (SECURE)
        # ==============================================

        location /api/auth {
            limit_req zone=auth burst=10 nodelay;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 15s;

            # No caching for authentication
            proxy_cache off;

            # Additional security headers
            add_header X-Frame-Options DENY;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma no-cache;
            add_header Expires 0;

            access_log /var/log/nginx/auth.log production;
        }

        # ==============================================
        # METRICS ENDPOINTS (MONITORING)
        # ==============================================

        location /metrics {
            # Allow internal monitoring systems
            allow 172.21.0.0/16;  # Docker network
            allow 127.0.0.1;      # Localhost
            deny all;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;

            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;

            # No caching for metrics
            proxy_cache off;
        }

        # ==============================================
        # WEBSOCKET SUPPORT (REAL-TIME FEATURES)
        # ==============================================

        location /ws {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extended timeouts for WebSocket connections
            proxy_connect_timeout 7s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # WebSocket-specific settings
            proxy_buffering off;
            proxy_cache off;
        }

        # ==============================================
        # GENERAL API ENDPOINTS
        # ==============================================

        location /api {
            limit_req zone=api burst=200 nodelay;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 30s;

            # Standard proxy buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;

            # Selective caching for API responses
            proxy_cache api_cache;
            proxy_cache_valid 200 10m;
            proxy_cache_valid 404 1m;
            proxy_cache_bypass $arg_nocache $http_cache_control;

            add_header X-Cache-Status $upstream_cache_status;
        }

        # ==============================================
        # ROOT REDIRECT
        # ==============================================

        location / {
            return 301 /api/health;
        }

        # ==============================================
        # ERROR PAGES
        # ==============================================

        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    # ==============================================
    # COMMAND CENTER SERVER
    # ==============================================

    server {
        listen 80;
        server_name command.unittalk.com command-center.unittalk.com;

        # Security headers
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Rate limiting for command center
        limit_req zone=api burst=100 nodelay;
        limit_conn conn_limit_per_ip 10;

        location / {
            proxy_pass http://command_center_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;

            # Caching for static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
                proxy_cache static_cache;
                proxy_cache_valid 200 24h;
                expires 24h;
                add_header Cache-Control "public, immutable";
            }
        }
    }

    # ==============================================
    # MONITORING DASHBOARDS
    # ==============================================

    # Grafana Dashboard
    server {
        listen 80;
        server_name grafana.unittalk.com monitoring.unittalk.com;

        # Rate limiting for monitoring
        limit_req zone=api burst=50 nodelay;

        location / {
            proxy_pass http://grafana_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
        }
    }

    # Prometheus Metrics
    server {
        listen 80;
        server_name prometheus.unittalk.com metrics.unittalk.com;

        # Restrict access to internal networks
        allow 172.21.0.0/16;  # Docker network
        allow 10.0.0.0/8;     # Private networks
        deny all;

        location / {
            proxy_pass http://prometheus_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Temporal UI
    server {
        listen 80;
        server_name temporal.unittalk.com workflows.unittalk.com;

        # Restrict access to internal networks
        allow 172.21.0.0/16;  # Docker network
        allow 10.0.0.0/8;     # Private networks
        deny all;

        location / {
            proxy_pass http://temporal_ui_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ==============================================
    # FALLBACK SERVER (MAINTENANCE MODE)
    # ==============================================

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Return maintenance page for unmatched hosts
        location / {
            return 503 "Unit Talk Platform - Maintenance Mode";
            add_header Content-Type "text/plain" always;
            add_header Retry-After 300 always;
        }
    }

    # ==============================================
    # REAL-TIME STATUS CONFIGURATION
    # ==============================================

    # Enable NGINX status module for monitoring
    server {
        listen 8080;
        server_name localhost;

        # Restrict to internal access
        allow 172.21.0.0/16;
        deny all;

        location /nginx_status {
            stub_status on;
            access_log off;
        }

        location /health {
            return 200 "NGINX OK";
            add_header Content-Type "text/plain";
            access_log off;
        }
    }
}

# ==============================================
# STREAM CONFIGURATION (TCP/UDP LOAD BALANCING)
# ==============================================

stream {
    # Database connection load balancing
    upstream postgres_backend {
        least_conn;
        server postgres-primary:5432 max_fails=3 fail_timeout=30s weight=3;
        server postgres-replica:5432 max_fails=3 fail_timeout=30s weight=1 backup;
    }

    # Redis connection load balancing
    upstream redis_backend {
        server redis-primary:6379 max_fails=3 fail_timeout=30s;
    }

    # PostgreSQL load balancer
    server {
        listen 5432;
        proxy_pass postgres_backend;
        proxy_timeout 3s;
        proxy_connect_timeout 1s;
        proxy_responses 1;
    }

    # Redis load balancer
    server {
        listen 6379;
        proxy_pass redis_backend;
        proxy_timeout 3s;
        proxy_connect_timeout 1s;
        proxy_responses 1;
    }
}