# Nginx Blue/Green Routing Configuration for Unit Talk Platform
# Supports environment-based traffic switching

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'deployment="$deployment_color" active="$active_color"';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;
    
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    # Set deployment color variable from environment
    map $arg_color $deployment_color {
        default "${ACTIVE_COLOR}";
        blue "blue";
        green "green";
    }
    
    # Set active color for logging
    set $active_color "${ACTIVE_COLOR}";
    
    # Blue deployment upstream
    upstream api-blue {
        least_conn;
        server api-blue:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    # Green deployment upstream
    upstream api-green {
        least_conn;
        server api-green:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    # Command Center Blue upstream
    upstream command-center-blue {
        least_conn;
        server command-center-blue:3015 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    # Command Center Green upstream
    upstream command-center-green {
        least_conn;
        server command-center-green:3015 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    # Active upstream selection based on ACTIVE_COLOR
    map $active_color $api_upstream {
        default "api-blue";
        blue "api-blue";
        green "api-green";
    }
    
    map $active_color $command_center_upstream {
        default "command-center-blue";
        blue "command-center-blue";
        green "command-center-green";
    }
    
    # Health check endpoint
    server {
        listen 80;
        server_name health.unit-talk.local localhost;
        
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            add_header X-Active-Color $active_color;
            return 200 "OK - Active: $active_color\n";
        }
        
        location /health/blue {
            access_log off;
            proxy_pass http://api-blue/api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Deployment-Color blue;
        }
        
        location /health/green {
            access_log off;
            proxy_pass http://api-green/api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Deployment-Color green;
        }
    }
    
    # Main API routing
    server {
        listen 80;
        server_name api.unit-talk.local localhost;
        
        # Enable large file uploads
        client_max_body_size 10M;
        
        # Proxy timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Deployment-Color $active_color;
        proxy_set_header X-Request-ID $request_id;
        
        # Main API routes
        location /api/ {
            proxy_pass http://$api_upstream;
            
            # Add response headers for debugging
            add_header X-Served-By $api_upstream always;
            add_header X-Active-Color $active_color always;
            
            # Handle WebSocket upgrades
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        
        # Direct access routes for testing
        location /blue/api/ {
            proxy_pass http://api-blue/api/;
            add_header X-Served-By "api-blue" always;
            add_header X-Force-Color "blue" always;
        }
        
        location /green/api/ {
            proxy_pass http://api-green/api/;
            add_header X-Served-By "api-green" always;
            add_header X-Force-Color "green" always;
        }
        
        # Metrics endpoints
        location /metrics {
            proxy_pass http://$api_upstream/metrics;
            add_header X-Served-By $api_upstream always;
        }
    }
    
    # Command Center routing
    server {
        listen 80;
        server_name command-center.unit-talk.local localhost;
        
        # Proxy timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Deployment-Color $active_color;
        
        # Main routes
        location / {
            proxy_pass http://$command_center_upstream;
            
            # Add response headers
            add_header X-Served-By $command_center_upstream always;
            add_header X-Active-Color $active_color always;
            
            # Handle Next.js specific routing
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        
        # Next.js hot reload support
        location /_next/webpack-hmr {
            proxy_pass http://$command_center_upstream/_next/webpack-hmr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        
        # API routes
        location /api/ {
            proxy_pass http://$command_center_upstream/api/;
            add_header X-Served-By $command_center_upstream always;
        }
        
        # Direct access for testing
        location /blue/ {
            proxy_pass http://command-center-blue/;
            add_header X-Served-By "command-center-blue" always;
            add_header X-Force-Color "blue" always;
        }
        
        location /green/ {
            proxy_pass http://command-center-green/;
            add_header X-Served-By "command-center-green" always;
            add_header X-Force-Color "green" always;
        }
    }
    
    # Canary traffic splitting (for advanced scenarios)
    server {
        listen 80;
        server_name canary.unit-talk.local;
        
        # Split traffic based on percentage
        location / {
            # Default to blue
            set $backend "api-blue";
            
            # Simple percentage-based routing (10% to green)
            if ($arg_canary = "true") {
                set $backend "api-green";
            }
            
            # Hash-based routing for consistent user experience
            if ($cookie_canary_user) {
                set $backend "api-green";
            }
            
            proxy_pass http://$backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Deployment-Color $backend;
            
            add_header X-Served-By $backend always;
        }
    }
}