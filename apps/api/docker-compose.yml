version: '3.8'

services:
  # Main API Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unit-talk-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - REDIS_URL=redis://redis:6379
      - UPTIME_ROBOT_WEBHOOK=${UPTIME_ROBOT_WEBHOOK}
      - DISCORD_WEBHOOK=${DISCORD_WEBHOOK}
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./logs:/app/logs
    networks:
      - unit-talk-network

  # Discord Bot Worker
  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile.discord
    container_name: unit-talk-discord-bot
    environment:
      - NODE_ENV=production
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
      - REDIS_URL=redis://redis:6379
      - API_URL=http://api:3000
    depends_on:
      - redis
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
    volumes:
      - ./logs:/app/logs
    networks:
      - unit-talk-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: unit-talk-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - unit-talk-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: unit-talk-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./config/nginx/ssl:/etc/nginx/ssl
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - unit-talk-network

  # Monitoring Service
  monitoring:
    image: prom/prometheus:latest
    container_name: unit-talk-monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./config/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - unit-talk-network

  # Backup Service
  backup:
    image: alpine:latest
    container_name: unit-talk-backup
    volumes:
      - ./scripts/backup.sh:/backup.sh
      - backup_data:/backups
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - BACKUP_RETENTION_DAYS=7
    command: >
      sh -c "
        chmod +x /backup.sh &&
        echo '0 2 * * * /backup.sh' | crontab - &&
        crond -f
      "
    restart: unless-stopped
    networks:
      - unit-talk-network

volumes:
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  backup_data:
    driver: local

networks:
  unit-talk-network:
    driver: bridge