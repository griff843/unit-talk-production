# Unit Talk Platform - Production Environment
# Docker Compose for production deployment with high availability and security

version: '3.8'

services:
  # Temporal Server - Production configuration with clustering
  temporal:
    image: temporalio/auto-setup:1.22.0
    container_name: temporal-prod
    ports:
      - "7233:7233"
      - "8233:8233"
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${TEMPORAL_DB_PASSWORD}
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/production.yaml
      - TEMPORAL_CLI_ADDRESS=temporal:7233
      - TEMPORAL_BROADCAST_ADDRESS=0.0.0.0
    volumes:
      - ./config/temporal:/etc/temporal/config/dynamicconfig
      - temporal-prod-data:/etc/temporal/config/dynamicconfig
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - unit-talk-prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "workflow", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  # Temporal Web UI - Production (restricted access)
  temporal-web:
    image: temporalio/web:2.21.3
    container_name: temporal-web-prod
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=https://unittalk.com,https://admin.unittalk.com
      - TEMPORAL_AUTH_ENABLED=true
    depends_on:
      temporal:
        condition: service_healthy
    networks:
      - unit-talk-prod
    restart: unless-stopped
    profiles:
      - admin  # Only start when explicitly requested

  # Main Application - Production
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: unit-talk-app-prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - REDIS_URL=redis://redis:6379
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=unit-talk-prod
      - TEMPORAL_TASK_QUEUE=unit-talk-prod
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - LOG_LEVEL=warn
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - DISCORD_OPERATOR_WEBHOOK_URL=${DISCORD_OPERATOR_WEBHOOK_URL}
      - OPTIMAL_API_KEY=${OPTIMAL_API_KEY}
      - SGO_API_KEY=${SGO_API_KEY}
      - RATE_LIMIT_ENABLED=true
      - SECURITY_HEADERS_ENABLED=true
    depends_on:
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    networks:
      - unit-talk-prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'

  # Temporal Worker - Production (multiple instances)
  temporal-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      - NODE_ENV=production
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - REDIS_URL=redis://redis:6379
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=unit-talk-prod
      - TEMPORAL_TASK_QUEUE=unit-talk-prod
      - LOG_LEVEL=warn
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - DISCORD_OPERATOR_WEBHOOK_URL=${DISCORD_OPERATOR_WEBHOOK_URL}
      - OPTIMAL_API_KEY=${OPTIMAL_API_KEY}
      - SGO_API_KEY=${SGO_API_KEY}
    depends_on:
      temporal:
        condition: service_healthy
      app:
        condition: service_healthy
    restart: unless-stopped
    command: ["node", "dist/workers/temporal-worker.js"]
    volumes:
      - ./logs:/app/logs
    networks:
      - unit-talk-prod
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    deploy:
      replicas: 3  # Multiple worker instances for high availability
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  # Discord Bot - Production
  discord-bot:
    build:
      context: ./unit-talk-custom-bot
      dockerfile: Dockerfile
    container_name: discord-bot-prod
    environment:
      - NODE_ENV=production
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - API_BASE_URL=http://app:3000
      - LOG_LEVEL=warn
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - unit-talk-prod
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  # Redis - Production with persistence and clustering
  redis:
    image: redis:7-alpine
    container_name: redis-prod
    ports:
      - "6379:6379"
    volumes:
      - redis-prod-data:/data
      - ./config/redis/redis-prod.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: unless-stopped
    networks:
      - unit-talk-prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  # PostgreSQL - Production with backup and replication
  postgres:
    image: postgres:15-alpine
    container_name: postgres-prod
    environment:
      - POSTGRES_DB=unit_talk_prod
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_MULTIPLE_DATABASES=temporal
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    ports:
      - "5432:5432"
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
      - ./scripts/init-temporal-db.sql:/docker-entrypoint-initdb.d/01-temporal.sql
      - ./scripts/database_optimization.sql:/docker-entrypoint-initdb.d/02-optimization.sql
      - ./backups:/backups
    restart: unless-stopped
    networks:
      - unit-talk-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'

  # Nginx - Production reverse proxy with SSL
  nginx:
    image: nginx:alpine
    container_name: nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/prod.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - unit-talk-prod
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  # Prometheus - Production metrics with long-term storage
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus-prod
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus-prod.yml:/etc/prometheus/prometheus.yml
      - ./config/prometheus/rules:/etc/prometheus/rules
      - prometheus-prod-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=720h'  # 30 days
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    restart: unless-stopped
    networks:
      - unit-talk-prod
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'

  # Grafana - Production dashboards
  grafana:
    image: grafana/grafana:10.0.0
    container_name: grafana-prod
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=redis-datasource
      - GF_SERVER_ROOT_URL=https://grafana.unittalk.com
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_STRICT_TRANSPORT_SECURITY=true
    volumes:
      - grafana-prod-data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources
    restart: unless-stopped
    networks:
      - unit-talk-prod
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  # Loki - Production log aggregation
  loki:
    image: grafana/loki:2.9.0
    container_name: loki-prod
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki/loki-prod.yml:/etc/loki/local-config.yaml
      - loki-prod-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - unit-talk-prod
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  # Promtail - Production log shipping
  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail-prod
    volumes:
      - ./logs:/var/log/app
      - ./config/promtail/promtail-prod.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    networks:
      - unit-talk-prod
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  # Alertmanager - Production alerting
  alertmanager:
    image: prom/alertmanager:v0.25.0
    container_name: alertmanager-prod
    ports:
      - "9093:9093"
    volumes:
      - ./config/alertmanager/alertmanager-prod.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager-prod-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=https://alerts.unittalk.com'
    restart: unless-stopped
    networks:
      - unit-talk-prod
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backup Service - Automated backups
  backup:
    image: postgres:15-alpine
    container_name: backup-prod
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh
    command: |
      sh -c '
        while true; do
          sleep 86400  # 24 hours
          /backup.sh
        done
      '
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - unit-talk-prod
    profiles:
      - backup  # Only start when explicitly requested

volumes:
  redis-prod-data:
    driver: local
  postgres-prod-data:
    driver: local
  prometheus-prod-data:
    driver: local
  grafana-prod-data:
    driver: local
  loki-prod-data:
    driver: local
  temporal-prod-data:
    driver: local
  alertmanager-prod-data:
    driver: local

networks:
  unit-talk-prod:
    driver: bridge
    name: unit-talk-prod