name: Command Center Wiring Smoke Tests

on:
  pull_request:
    paths:
      - 'apps/command-center/**'
      - '.github/workflows/cc-wiring-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'apps/command-center/**'
      - '.github/workflows/cc-wiring-smoke.yml'
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: command_center_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'apps/command-center/package-lock.json'

      - name: Install dependencies
        working-directory: apps/command-center
        run: npm ci

      - name: Build Command Center
        working-directory: apps/command-center
        env:
          NODE_ENV: test
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
        run: npm run build

      - name: Start Command Center (background)
        working-directory: apps/command-center
        env:
          NODE_ENV: test
          PORT: 3018
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
        run: |
          npm start &
          echo $! > .next_pid
        
      - name: Wait for server to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:3018/api/health 2>/dev/null; do sleep 2; done' || true
          sleep 5

      - name: Run wiring smoke tests
        working-directory: apps/command-center
        env:
          BASE_URL: http://localhost:3018
        run: npx tsx scripts/smoke/wiring-smoke.ts

      - name: Cleanup
        if: always()
        working-directory: apps/command-center
        run: |
          if [ -f .next_pid ]; then
            kill $(cat .next_pid) || true
            rm .next_pid
          fi

  # Local smoke test script
  local-smoke-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'apps/command-center/package-lock.json'

      - name: Install dependencies
        working-directory: apps/command-center
        run: npm ci

      - name: Create local smoke test script
        working-directory: apps/command-center
        run: |
          cat > scripts/local-smoke.sh << 'EOF'
          #!/bin/bash
          set -e
          
          echo "🚀 Starting local smoke test..."
          
          # Check if dev server is running
          if curl -f http://localhost:3000/api/health 2>/dev/null; then
            echo "✅ Dev server is running"
            echo "🧪 Running smoke tests against local server..."
            npx tsx scripts/smoke/wiring-smoke.ts
          else
            echo "❌ Dev server not running at http://localhost:3000"
            echo "Please run 'npm run dev' first, then run this script again."
            exit 1
          fi
          EOF
          
          chmod +x scripts/local-smoke.sh

      - name: Show local usage instructions
        run: |
          echo "📋 Local Smoke Test Usage:"
          echo ""
          echo "1. Start your development server:"
          echo "   cd apps/command-center && npm run dev"
          echo ""
          echo "2. In another terminal, run smoke tests:"
          echo "   cd apps/command-center && ./scripts/local-smoke.sh"
          echo ""
          echo "Or run directly:"
          echo "   cd apps/command-center && npx tsx scripts/smoke/wiring-smoke.ts"