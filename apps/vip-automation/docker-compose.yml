version: '3.8'

services:
  vip-automation:
    build: .
    container_name: unit-talk-vip-automation
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
    env_file:
      - ../../.env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - unit-talk-network
    depends_on:
      - discord-bot
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  unit-talk-network:
    external: true