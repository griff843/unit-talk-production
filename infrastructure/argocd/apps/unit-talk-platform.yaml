# ArgoCD Application - Unit Talk Platform Services
# Manages all application workloads with health assessments
# Date: 2025-01-24

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: unit-talk-api
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: production

  source:
    repoURL: https://github.com/griff843/unit-talk-production.git
    targetRevision: main
    path: infrastructure/kubernetes
    directory:
      include: 'api-deployment.yaml'

  destination:
    server: https://kubernetes.default.svc
    namespace: unit-talk

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Health assessment configuration
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas  # Managed by HPA

  # Health checks
  health:
    - group: apps
      kind: Deployment
      check: |
        hs = {}
        if obj.status ~= nil then
          if obj.status.updatedReplicas == obj.status.replicas and
             obj.status.availableReplicas == obj.status.replicas and
             obj.status.observedGeneration == obj.metadata.generation then
            hs.status = "Healthy"
            hs.message = "All replicas ready"
            return hs
          end
        end
        hs.status = "Progressing"
        hs.message = "Waiting for rollout"
        return hs

