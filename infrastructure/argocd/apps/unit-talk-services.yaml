---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: unit-talk-workers
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    repoURL: https://github.com/griff843/unit-talk-production.git
    targetRevision: main
    path: infrastructure/kubernetes/workers
    
    helm:
      parameters:
        - name: image.repository
          value: registry.digitalocean.com/unit-talk/workers
        - name: image.tag
          value: latest
        - name: replicaCount
          value: "2"
        - name: autoscaling.enabled
          value: "true"
        - name: autoscaling.minReplicas
          value: "2"
        - name: autoscaling.maxReplicas
          value: "8"
        - name: nodeSelector.workload-type
          value: "workers"
        - name: tolerations[0].key
          value: "workload-type"
        - name: tolerations[0].value
          value: "workers"
        - name: tolerations[0].effect
          value: "NoSchedule"
  
  destination:
    server: https://kubernetes.default.svc
    namespace: unit-talk
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

