# ArgoCD Applications - Unit Talk Platform Services
# Manages all Unit Talk application deployments with blue/green strategy
# Date: 2025-01-24

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: unit-talk-api
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    repoURL: https://github.com/griff843/unit-talk-production.git
    targetRevision: main
    path: infrastructure/kubernetes/api
    
    helm:
      parameters:
        - name: image.repository
          value: registry.digitalocean.com/unit-talk/api
        - name: image.tag
          value: latest
        - name: replicaCount
          value: "3"
        - name: autoscaling.enabled
          value: "true"
        - name: autoscaling.minReplicas
          value: "3"
        - name: autoscaling.maxReplicas
          value: "10"
        - name: autoscaling.targetCPUUtilizationPercentage
          value: "70"
  
  destination:
    server: https://kubernetes.default.svc
    namespace: unit-talk
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  # Health assessment
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas

