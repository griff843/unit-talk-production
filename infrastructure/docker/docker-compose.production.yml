version: "3.8"

services:
  # API Service
  api:
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile
    container_name: unit-talk-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - TEMPORAL_SERVER_URL=${TEMPORAL_SERVER_URL}
    depends_on:
      - redis
      - postgres
    networks:
      - unit-talk-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Discord Bot
  discord-bot:
    build:
      context: ../../
      dockerfile: apps/discord-bot/Dockerfile
    container_name: unit-talk-discord-bot
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - api
      - postgres
    networks:
      - unit-talk-network

  # Dashboard
  dashboard:
    build:
      context: ../../
      dockerfile: apps/dashboard/Dockerfile
    container_name: unit-talk-dashboard
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    networks:
      - unit-talk-network

  # Smart Form
  smart-form:
    build:
      context: ../../
      dockerfile: apps/smart-form/Dockerfile
    container_name: unit-talk-smart-form
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    networks:
      - unit-talk-network

  # Command Center
  command-center:
    build:
      context: ../../
      dockerfile: apps/command-center/Dockerfile
    container_name: unit-talk-command-center
    restart: unless-stopped
    ports:
      - "3003:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    networks:
      - unit-talk-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: unit-talk-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../packages/database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - unit-talk-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: unit-talk-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - unit-talk-network

  # Temporal Server
  temporal:
    image: temporalio/auto-setup:1.22
    container_name: unit-talk-temporal
    restart: unless-stopped
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=postgres
    depends_on:
      - postgres
    ports:
      - "7233:7233"
      - "8233:8233"
    networks:
      - unit-talk-network

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: unit-talk-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - unit-talk-network

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: unit-talk-grafana
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - unit-talk-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  unit-talk-network:
    driver: bridge
