# Alertmanager Configuration for SLO Enforcement
# Phase 13 - Performance and Reliability Hardening
# Date: 2025-01-25
#
# SLO Targets:
# - API p95 latency: < 150ms
# - Error rate: < 0.5%
# - Uptime: 99.95%
# - Database p95 latency: < 50ms

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      
      # Slack configuration
      slack_api_url: ${SLACK_WEBHOOK_URL}
      
      # PagerDuty configuration
      pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'
      
      # SMTP configuration for email alerts
      smtp_smarthost: '${SMTP_HOST}:${SMTP_PORT}'
      smtp_from: 'alerts@unit-talk.com'
      smtp_auth_username: '${SMTP_USERNAME}'
      smtp_auth_password: '${SMTP_PASSWORD}'
      smtp_require_tls: true
    
    # Templates for alert formatting
    templates:
      - '/etc/alertmanager/templates/*.tmpl'
    
    # Routing tree
    route:
      # Default receiver
      receiver: 'slack-general'
      
      # Group alerts by these labels
      group_by: ['alertname', 'cluster', 'service', 'severity']
      
      # Wait time before sending initial notification
      group_wait: 10s
      
      # Wait time before sending notification about new alerts in group
      group_interval: 10s
      
      # Wait time before re-sending notification
      repeat_interval: 12h
      
      # Child routes
      routes:
        # Critical SLO violations - immediate PagerDuty + Slack
        - match:
            severity: critical
            slo: latency
          receiver: 'pagerduty-critical'
          continue: true
          group_wait: 0s
          repeat_interval: 5m
        
        - match:
            severity: critical
            slo: error-rate
          receiver: 'pagerduty-critical'
          continue: true
          group_wait: 0s
          repeat_interval: 5m
        
        - match:
            severity: critical
            slo: availability
          receiver: 'pagerduty-critical'
          continue: true
          group_wait: 0s
          repeat_interval: 5m
        
        # All critical alerts to Slack
        - match:
            severity: critical
          receiver: 'slack-critical'
          continue: true
          group_wait: 0s
          repeat_interval: 30m
        
        # Warning SLO violations - Slack only
        - match:
            severity: warning
            slo: latency
          receiver: 'slack-slo-warnings'
          group_wait: 30s
          repeat_interval: 1h
        
        - match:
            severity: warning
            slo: error-rate
          receiver: 'slack-slo-warnings'
          group_wait: 30s
          repeat_interval: 1h
        
        # Database alerts
        - match:
            component: database
          receiver: 'slack-database'
          group_wait: 30s
          repeat_interval: 1h
        
        # Redis alerts
        - match:
            service: redis
          receiver: 'slack-infrastructure'
          group_wait: 30s
          repeat_interval: 1h
        
        # Error budget alerts
        - match:
            slo: error-budget
          receiver: 'slack-error-budget'
          group_wait: 1m
          repeat_interval: 6h
        
        # Business logic alerts
        - match_re:
            alertname: '(LowGradingAccuracy|PickProcessingDelay|StaleData)'
          receiver: 'slack-business'
          group_wait: 1m
          repeat_interval: 2h
        
        # Agent health alerts
        - match_re:
            alertname: '(AgentDown|HighErrorRate|HighProcessingLatency)'
          receiver: 'slack-agents'
          group_wait: 30s
          repeat_interval: 1h
    
    # Inhibition rules (suppress alerts based on other alerts)
    inhibit_rules:
      # Inhibit warning if critical is firing
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'cluster', 'service']
      
      # Inhibit individual pod alerts if service is down
      - source_match:
          alertname: 'ServiceDown'
        target_match_re:
          alertname: '(HighCPUUtilization|HighMemoryUtilization|PodRestartRateHigh)'
        equal: ['service']
      
      # Inhibit latency warnings if error rate is high
      - source_match:
          slo: 'error-rate'
          severity: 'critical'
        target_match:
          slo: 'latency'
          severity: 'warning'
        equal: ['service']
    
    # Receivers (notification channels)
    receivers:
      # Default Slack channel
      - name: 'slack-general'
        slack_configs:
          - channel: '#alerts'
            title: '{{ .GroupLabels.alertname }}'
            text: |
              {{ range .Alerts }}
              *Alert:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              *Severity:* {{ .Labels.severity }}
              *Component:* {{ .Labels.component }}
              {{ if .Annotations.runbook_url }}*Runbook:* {{ .Annotations.runbook_url }}{{ end }}
              {{ if .Annotations.dashboard_url }}*Dashboard:* {{ .Annotations.dashboard_url }}{{ end }}
              {{ end }}
            color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
            send_resolved: true
      
      # Critical alerts - PagerDuty
      - name: 'pagerduty-critical'
        pagerduty_configs:
          - service_key: '${PAGERDUTY_SERVICE_KEY}'
            description: '{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}'
            severity: 'critical'
            details:
              firing: '{{ .Alerts.Firing | len }}'
              resolved: '{{ .Alerts.Resolved | len }}'
              group_labels: '{{ .GroupLabels }}'
              common_annotations: '{{ .CommonAnnotations }}'
            client: 'Unit Talk Alertmanager'
            client_url: 'https://grafana.unit-talk.com'
      
      # Critical alerts - Slack
      - name: 'slack-critical'
        slack_configs:
          - channel: '#alerts-critical'
            title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
            text: |
              {{ range .Alerts }}
              *Alert:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              *Component:* {{ .Labels.component }}
              *SLO:* {{ .Labels.slo }}
              {{ if .Annotations.runbook_url }}*Runbook:* {{ .Annotations.runbook_url }}{{ end }}
              {{ if .Annotations.dashboard_url }}*Dashboard:* {{ .Annotations.dashboard_url }}{{ end }}
              {{ end }}
            color: 'danger'
            send_resolved: true
            actions:
              - type: button
                text: 'View Runbook'
                url: '{{ (index .Alerts 0).Annotations.runbook_url }}'
              - type: button
                text: 'View Dashboard'
                url: '{{ (index .Alerts 0).Annotations.dashboard_url }}'
      
      # SLO warnings - Slack
      - name: 'slack-slo-warnings'
        slack_configs:
          - channel: '#alerts-slo'
            title: '⚠️ SLO Warning: {{ .GroupLabels.alertname }}'
            text: |
              {{ range .Alerts }}
              *Alert:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              *SLO:* {{ .Labels.slo }}
              *Current Value:* {{ .Annotations.current_value }}
              {{ end }}
            color: 'warning'
            send_resolved: true
      
      # Database alerts - Slack
      - name: 'slack-database'
        slack_configs:
          - channel: '#alerts-database'
            title: '🗄️ Database Alert: {{ .GroupLabels.alertname }}'
            text: |
              {{ range .Alerts }}
              *Alert:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              {{ if .Annotations.runbook_url }}*Runbook:* {{ .Annotations.runbook_url }}{{ end }}
              {{ end }}
            color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
            send_resolved: true
      
      # Infrastructure alerts - Slack
      - name: 'slack-infrastructure'
        slack_configs:
          - channel: '#alerts-infrastructure'
            title: '🏗️ Infrastructure Alert: {{ .GroupLabels.alertname }}'
            text: |
              {{ range .Alerts }}
              *Alert:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              *Service:* {{ .Labels.service }}
              {{ end }}
            color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
            send_resolved: true
      
      # Error budget alerts - Slack
      - name: 'slack-error-budget'
        slack_configs:
          - channel: '#alerts-error-budget'
            title: '📊 Error Budget Alert: {{ .GroupLabels.alertname }}'
            text: |
              {{ range .Alerts }}
              *Alert:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              *Burn Rate:* {{ .Annotations.burn_rate }}
              {{ if .Annotations.dashboard_url }}*Dashboard:* {{ .Annotations.dashboard_url }}{{ end }}
              {{ end }}
            color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'
            send_resolved: true
      
      # Business logic alerts - Slack
      - name: 'slack-business'
        slack_configs:
          - channel: '#alerts-business'
            title: '💼 Business Alert: {{ .GroupLabels.alertname }}'
            text: |
              {{ range .Alerts }}
              *Alert:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              {{ end }}
            color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'
            send_resolved: true
      
      # Agent health alerts - Slack
      - name: 'slack-agents'
        slack_configs:
          - channel: '#alerts-agents'
            title: '🤖 Agent Alert: {{ .GroupLabels.alertname }}'
            text: |
              {{ range .Alerts }}
              *Alert:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              *Agent:* {{ .Labels.agent }}
              {{ end }}
            color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
            send_resolved: true

---
# Alertmanager Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  replicas: 2  # High availability
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.26.0
          args:
            - '--config.file=/etc/alertmanager/alertmanager.yml'
            - '--storage.path=/alertmanager'
            - '--web.external-url=https://alerts.unit-talk.com'
            - '--cluster.listen-address=0.0.0.0:9094'
            - '--cluster.advertise-address=$(POD_IP):9094'
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - containerPort: 9093
              name: web
            - containerPort: 9094
              name: cluster
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: storage
              mountPath: /alertmanager
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: storage
          persistentVolumeClaim:
            claimName: alertmanager-pvc

