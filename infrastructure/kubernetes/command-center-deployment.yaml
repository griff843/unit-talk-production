apiVersion: apps/v1
kind: Deployment
metadata:
  name: unit-talk-command-center-blue
  namespace: unit-talk
  labels:
    app: unit-talk-command-center
    version: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: unit-talk-command-center
      version: blue
  template:
    metadata:
      labels:
        app: unit-talk-command-center
        version: blue
    spec:
      containers:
        - name: command-center
          image: ghcr.io/griff843/unit-talk-production/command-center:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: 'production'
            - name: NEXT_PUBLIC_SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: unit-talk-secrets
                  key: supabase-url
            - name: NEXT_PUBLIC_SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: unit-talk-secrets
                  key: supabase-anon-key
          resources:
            requests:
              memory: '256Mi'
              cpu: '200m'
            limits:
              memory: '512Mi'
              cpu: '400m'
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
