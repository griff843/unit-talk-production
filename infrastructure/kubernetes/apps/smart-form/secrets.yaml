# Smart Form Production Secrets
# Date: 2025-10-25
# Apply with: kubectl apply -f secrets.yaml

apiVersion: v1
kind: Secret
metadata:
  name: smart-form-secrets
  namespace: unit-talk
  labels:
    app: smart-form
    tier: frontend
type: Opaque
stringData:
  # Core Application Settings
  NODE_ENV: "production"
  PORT: "3021"
  LOG_LEVEL: "info"
  
  # Pick Driver Configuration
  PICK_DRIVER: "unified"  # stays until we flip to canonical after DB is ready
  PUBLISH_MODE: "outbox"  # 'direct' allowed if no worker, but prefer 'outbox'
  
  # Multi-Tenancy Configuration
  TENANT_ID: "12d8d677-4d2c-45a6-bbbf-cf6b0f98c79a"  # Default tenant ID
  DEFAULT_TENANT_ID: "12d8d677-4d2c-45a6-bbbf-cf6b0f98c79a"
  
  # CDN Configuration
  CDN_BASE: "https://cdn.unit-talk.app"
  
  # Redis Configuration
  REDIS_URL: "redis://unit-talk-redis:6379"
  REDIS_PREFIX: "smartform"
  RATE_LIMIT_REDIS_PREFIX: "smartform"
  
  # Feature Flags
  SMARTFORM_FEATURES: "capperSelect,playerSearch,gameResolve,discordPreview,scoringSlider"
  SMARTFORM_LEAGUES: "NBA,NFL,MLB,NHL,NCAAF"
  
  # Database Configuration (Supabase)
  # SPRINT-SUPABASE-ENDPOINT-TRUTH-LOCK-110A: Updated to canonical production Supabase
  # REPLACE WITH ACTUAL VALUES FROM KUBERNETES SECRETS MANAGEMENT (values below are placeholders)
  NEXT_PUBLIC_SUPABASE_URL: "https://cqfnsozknjzvyiziwicl.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "REPLACE_WITH_ACTUAL_ANON_KEY"
  SUPABASE_URL: "https://cqfnsozknjzvyiziwicl.supabase.co"
  SUPABASE_SERVICE_ROLE_KEY: "REPLACE_WITH_ACTUAL_SERVICE_ROLE_KEY"
  DATABASE_URL: "postgresql://postgres:REPLACE_PASSWORD@postgres:5432/unit_talk_prod"
  DATABASE_RO_URL: "postgresql://postgres:REPLACE_PASSWORD@postgres-replica:5432/unit_talk_prod"
  
  # Discord Integration
  DISCORD_BOT_TOKEN: "REPLACE_WITH_ACTUAL_BOT_TOKEN"
  DISCORD_APP_ID: "REPLACE_WITH_ACTUAL_APP_ID"
  DISCORD_CLIENT_ID: "REPLACE_WITH_ACTUAL_CLIENT_ID"
  DISCORD_WEBHOOK_URL: "REPLACE_WITH_ACTUAL_WEBHOOK_URL"
  
  # External API Keys
  OPTIMAL_API_KEY: "REPLACE_WITH_ACTUAL_OPTIMAL_KEY"
  ODDS_API_KEY: "REPLACE_WITH_ACTUAL_ODDS_KEY"
  
  # OpenTelemetry Configuration
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318/v1/traces"
  OTEL_SERVICE_NAME: "smart-form"
  OTEL_SAMPLE_RATE_READS: "0.1"  # 10% for reads
  OTEL_SAMPLE_RATE_WRITES: "1.0"  # 100% for POST /api/picks
  
  # Rate Limiting Configuration
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_READ_RPM: "300"  # 300 req/min for GET /players/search and /games/resolve
  RATE_LIMIT_WRITE_RPM: "60"  # 60 req/min for POST /api/picks
  
  # Cache Configuration
  CACHE_ENABLED: "true"
  CACHE_TTL_PLAYERS: "60"  # 60 seconds
  CACHE_TTL_GAMES: "60"  # 60 seconds
  CACHE_STALE_WHILE_REVALIDATE: "120"  # 120 seconds
  CACHE_CDN_MAX_AGE: "600"  # 10 minutes for CDN
  
  # Security Configuration
  SECURITY_HEADERS_ENABLED: "true"
  
  # Monitoring Configuration
  PROMETHEUS_ENABLED: "true"
  METRICS_PORT: "9090"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: smart-form-config
  namespace: unit-talk
  labels:
    app: smart-form
    tier: frontend
data:
  # Application Configuration
  app.config.json: |
    {
      "name": "smart-form",
      "version": "1.0.0",
      "environment": "production",
      "features": {
        "capperSelect": true,
        "playerSearch": true,
        "gameResolve": true,
        "discordPreview": true,
        "scoringSlider": true
      },
      "leagues": ["NBA", "NFL", "MLB", "NHL", "NCAAF"],
      "cache": {
        "enabled": true,
        "ttl": {
          "players": 60,
          "games": 60,
          "props": 300
        }
      },
      "rateLimits": {
        "read": {
          "rpm": 300,
          "burst": 50
        },
        "write": {
          "rpm": 60,
          "burst": 10
        }
      }
    }
  
  # Nginx Configuration for caching
  nginx.conf: |
    # Cache configuration for Smart Form
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=smart_form_cache:10m max_size=1g inactive=60m use_temp_path=off;
    
    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=read_limit:10m rate=300r/m;
    limit_req_zone $http_x_user_id zone=write_limit:10m rate=60r/m;
    
    server {
      listen 80;
      server_name smart-form.unit-talk.com;
      
      # Cache for read endpoints
      location ~ ^/api/(players|games) {
        proxy_cache smart_form_cache;
        proxy_cache_valid 200 60s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        
        add_header X-Cache-Status $upstream_cache_status;
        
        limit_req zone=read_limit burst=50 nodelay;
        
        proxy_pass http://smart-form:3021;
      }
      
      # No cache for write endpoints
      location /api/submit-ticket {
        limit_req zone=write_limit burst=10 nodelay;
        
        proxy_pass http://smart-form:3021;
      }
    }

