# Resource Quotas for Unit Talk Platform
# Ensures resource limits per namespace
# Date: 2025-01-24

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: unit-talk
spec:
  hard:
    requests.cpu: '20'
    requests.memory: 40Gi
    limits.cpu: '40'
    limits.memory: 80Gi
    persistentvolumeclaims: '10'
    requests.storage: 500Gi

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: object-quota
  namespace: unit-talk
spec:
  hard:
    pods: '100'
    services: '50'
    secrets: '100'
    configmaps: '100'
    services.loadbalancers: '5'
    services.nodeports: '0'

---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: unit-talk
spec:
  limits:
    # Container defaults
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: 2000m
        memory: 4Gi
      min:
        cpu: 10m
        memory: 32Mi

    # Pod limits
    - type: Pod
      max:
        cpu: 4000m
        memory: 8Gi
      min:
        cpu: 10m
        memory: 32Mi

    # PVC limits
    - type: PersistentVolumeClaim
      max:
        storage: 100Gi
      min:
        storage: 1Gi

---
# Staging environment quotas
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: unit-talk-staging
spec:
  hard:
    requests.cpu: '10'
    requests.memory: 20Gi
    limits.cpu: '20'
    limits.memory: 40Gi
    persistentvolumeclaims: '5'
    requests.storage: 200Gi

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: object-quota
  namespace: unit-talk-staging
spec:
  hard:
    pods: '50'
    services: '25'
    secrets: '50'
    configmaps: '50'
    services.loadbalancers: '2'
    services.nodeports: '0'
