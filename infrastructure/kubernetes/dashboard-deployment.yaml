apiVersion: apps/v1
kind: Deployment
metadata:
  name: unit-talk-dashboard-blue
  namespace: unit-talk
  labels:
    app: unit-talk-dashboard
    version: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: unit-talk-dashboard
      version: blue
  template:
    metadata:
      labels:
        app: unit-talk-dashboard
        version: blue
    spec:
      containers:
        - name: dashboard
          image: ghcr.io/griff843/unit-talk-production/dashboard:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: 'production'
            - name: NEXT_PUBLIC_API_URL
              value: 'https://api.unit-talk.com'
          resources:
            requests:
              memory: '256Mi'
              cpu: '200m'
            limits:
              memory: '512Mi'
              cpu: '400m'
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
