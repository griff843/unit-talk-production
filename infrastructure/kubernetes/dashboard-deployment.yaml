---
apiVersion: v1
kind: Service
metadata:
  name: unit-talk-dashboard-blue
  namespace: unit-talk
spec:
  selector:
    app: unit-talk-dashboard
    version: blue
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
---
