      version: green
  template:
    metadata:
      labels:
        app: unit-talk-dashboard
        version: green
    spec:
      containers:
        - name: dashboard
          image: ghcr.io/griff843/unit-talk-production/dashboard:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
