apiVersion: apps/v1
kind: Deployment
metadata:
  name: unit-talk-api
  namespace: unit-talk
  labels:
    app: unit-talk-api
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: unit-talk-api
  template:
    metadata:
      labels:
        app: unit-talk-api
        version: v1
    spec:
      containers:
        - name: api
          image: unit-talk/api:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: 'production'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: unit-talk-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: unit-talk-secrets
                  key: redis-url
          resources:
            requests:
              memory: '512Mi'
              cpu: '250m'
            limits:
              memory: '1Gi'
              cpu: '500m'
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: unit-talk-api-service
  namespace: unit-talk
spec:
  selector:
    app: unit-talk-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: unit-talk-api-ingress
  namespace: unit-talk
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: '100'
spec:
  tls:
    - hosts:
        - api.unit-talk.com
      secretName: unit-talk-api-tls
  rules:
    - host: api.unit-talk.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: unit-talk-api-service
                port:
                  number: 80
