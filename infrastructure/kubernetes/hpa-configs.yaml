# Horizontal Pod Autoscaler Configurations
# Phase 13 - Performance and Reliability Hardening
# Target: API p95 < 150ms, scale based on CPU, memory, and custom metrics
# Date: 2025-01-25

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: unit-talk-api-hpa
  namespace: unit-talk
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: unit-talk-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    # CPU-based scaling (Phase 13: Refined to 70%)
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    # Memory-based scaling
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

    # Custom metric: HTTP request rate
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: '100'

    # Phase 13: Latency-based scaling (p95 < 150ms SLO)
    - type: Pods
      pods:
        metric:
          name: http_request_duration_p95_milliseconds
        target:
          type: AverageValue
          averageValue: '140'  # Buffer below 150ms SLO

    # Custom metric: p95 latency (target < 150ms)
    - type: Pods
      pods:
        metric:
          name: http_request_duration_p95
        target:
          type: AverageValue
          averageValue: '140'  # Buffer below 150ms target

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max

    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Min

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: discord-bot-hpa
  namespace: unit-talk
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: discord-bot
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75

    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

    # Custom metric: Discord events per second
    - type: Pods
      pods:
        metric:
          name: discord_events_per_second
        target:
          type: AverageValue
          averageValue: '50'

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
      selectPolicy: Max

    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
      selectPolicy: Min

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: command-center-hpa
  namespace: unit-talk
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: command-center
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 90
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Max

    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 90
      selectPolicy: Min

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: grading-agent-hpa
  namespace: unit-talk
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: grading-agent
  minReplicas: 3
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75

    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

    # Custom metric: Temporal task queue depth
    - type: Pods
      pods:
        metric:
          name: temporal_queue_depth
        target:
          type: AverageValue
          averageValue: '10'

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 3
          periodSeconds: 30
      selectPolicy: Max

    scaleDown:
      stabilizationWindowSeconds: 180
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Min
