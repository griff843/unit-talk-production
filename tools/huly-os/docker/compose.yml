# SPRINT-HULY-WORKOS-V1-LOCAL-001: Huly self-host stack (local only)
# Based on: https://github.com/hcengineering/huly-selfhost
# All images pinned — no :latest tags.

services:
  nginx:
    image: nginx:1.27.3
    ports:
      - "8087:80"
    volumes:
      - ./huly.nginx:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      front:
        condition: service_started
      account:
        condition: service_started
      transactor:
        condition: service_started
    networks:
      - huly_net
    restart: unless-stopped

  cockroach:
    image: cockroachdb/cockroach:v24.2.6
    command: start-single-node --insecure --store=attrs=ssd,path=/cockroach/cockroach-data
    volumes:
      - cockroach_data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - huly_net
    restart: unless-stopped

  elastic:
    image: elasticsearch:7.14.2
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - huly_net
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - huly_net
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v24.3.6
    command:
      - redpanda start
      - --smp 1
      - --memory 256M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr internal://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda:9092
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - huly_net
    restart: unless-stopped

  account:
    image: hardcoreeng/account:v0.7.382
    environment:
      - SERVER_SECRET=${SECRET}
      - ACCOUNTS_URI=http://account:3000
      - ACCOUNTS_URL=http://localhost:8087/_accounts
      - MONGO_URL=
      - DB_URL=postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      - TRANSACTOR_URL=ws://transactor:3333;ws://localhost:8087/_transactor
      - STORAGE_CONFIG=minio|minio?accessKey=${MINIO_ROOT_USER:-minioadmin}&secretKey=${MINIO_ROOT_PASSWORD:-minioadmin}
      - FRONT_URL=http://localhost:8087
      - MODEL_ENABLED=*
      - ACCOUNT_PORT=3000
      - QUEUE_CONFIG=redpanda:9092
      - BRANDING_PATH=
    depends_on:
      cockroach:
        condition: service_healthy
      minio:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - huly_net
    restart: unless-stopped

  workspace:
    image: hardcoreeng/workspace:v0.7.382
    environment:
      - SERVER_SECRET=${SECRET}
      - DB_URL=postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      - TRANSACTOR_URL=ws://transactor:3333
      - STORAGE_CONFIG=minio|minio?accessKey=${MINIO_ROOT_USER:-minioadmin}&secretKey=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MODEL_ENABLED=*
      - ACCOUNTS_URL=http://account:3000
      - QUEUE_CONFIG=redpanda:9092
      - ACCOUNTS_DB_URL=postgresql://root@cockroach:26257/defaultdb?sslmode=disable
    depends_on:
      cockroach:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      account:
        condition: service_started
      transactor:
        condition: service_started
    networks:
      - huly_net
    restart: unless-stopped

  transactor:
    image: hardcoreeng/transactor:v0.7.382
    environment:
      - SERVER_SECRET=${SECRET}
      - ACCOUNTS_URL=http://account:3000
      - MONGO_URL=
      - DB_URL=postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      - STORAGE_CONFIG=minio|minio?accessKey=${MINIO_ROOT_USER:-minioadmin}&secretKey=${MINIO_ROOT_PASSWORD:-minioadmin}
      - FRONT_URL=http://front:8080
      - UPLOAD_URL=/files
      - FULLTEXT_URL=http://fulltext:4700
      - REKONI_URL=http://rekoni:4004
      - COLLABORATOR_URL=ws://collaborator:3078
      - ELASTIC_URL=http://elastic:9200
      - QUEUE_CONFIG=redpanda:9092
      - BRANDING_PATH=
    depends_on:
      cockroach:
        condition: service_healthy
      elastic:
        condition: service_healthy
      minio:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      account:
        condition: service_started
    networks:
      - huly_net
    restart: unless-stopped

  collaborator:
    image: hardcoreeng/collaborator:v0.7.382
    environment:
      - COLLABORATOR_PORT=3078
      - SECRET=${SECRET}
      - ACCOUNTS_URL=http://account:3000
      - STORAGE_CONFIG=minio|minio?accessKey=${MINIO_ROOT_USER:-minioadmin}&secretKey=${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      cockroach:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - huly_net
    restart: unless-stopped

  front:
    image: hardcoreeng/front:v0.7.382
    environment:
      - SERVER_PORT=8080
      - SERVER_SECRET=${SECRET}
      - ACCOUNTS_URL=http://localhost:8087/_accounts
      - UPLOAD_URL=/files
      - ELASTIC_URL=http://elastic:9200
      - REKONI_URL=http://localhost:8087/_rekoni
      - COLLABORATOR_URL=ws://localhost:8087/_collaborator
      - STORAGE_CONFIG=minio|minio?accessKey=${MINIO_ROOT_USER:-minioadmin}&secretKey=${MINIO_ROOT_PASSWORD:-minioadmin}
      - GMAIL_URL=http://localhost:8087/_gmail
      - CALENDAR_URL=http://localhost:8087/_calendar
      - TELEGRAM_URL=http://localhost:8087/_telegram
      - LOVE_ENDPOINT=http://localhost:8087/_love
      - TITLE=Huly Self Host
      - DEFAULT_LANGUAGE=en
      - LAST_NAME_FIRST=true
    depends_on:
      account:
        condition: service_started
    networks:
      - huly_net
    restart: unless-stopped

  fulltext:
    image: hardcoreeng/fulltext:v0.7.382
    environment:
      - SERVER_SECRET=${SECRET}
      - ACCOUNTS_URL=http://account:3000
      - MONGO_URL=
      - DB_URL=postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      - FULLTEXT_DB_URL=http://elastic:9200
      - ELASTIC_INDEX_NAME=huly_storage_index
      - STORAGE_CONFIG=minio|minio?accessKey=${MINIO_ROOT_USER:-minioadmin}&secretKey=${MINIO_ROOT_PASSWORD:-minioadmin}
      - REKONI_URL=http://rekoni:4004
      - QUEUE_CONFIG=redpanda:9092
    depends_on:
      elastic:
        condition: service_healthy
      cockroach:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - huly_net
    restart: unless-stopped

  rekoni:
    image: hardcoreeng/rekoni-service:v0.7.382
    networks:
      - huly_net
    restart: unless-stopped

volumes:
  cockroach_data:
  elastic_data:
  minio_data:
  redpanda_data:

networks:
  huly_net:
    driver: bridge
