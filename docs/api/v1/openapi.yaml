  # - /api/analytics

tags:
  - name: Operations
    description: Health checks and system status
  - name: Picks
    description: Pick submission and retrieval
  - name: Games
    description: Game schedules and results
  - name: Agents
    description: Agent health and management
  - name: Settlement
    description: Pick settlement operations
