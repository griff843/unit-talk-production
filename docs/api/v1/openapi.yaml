openapi: '3.1.0'
info:
  title: Unit Talk API
  version: '1.0.0'
  description: |
    Sports pick syndication platform API.
    Ingests odds, grades picks, promotes via Discord, settles against outcomes.

servers:
  - url: http://localhost:3010
    description: Local development
  - url: https://api.unittalk.com
    description: Production

paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      tags: [Operations]
      responses:
        '200':
          description: Service healthy

  /health/provider:
    get:
      summary: Provider health status
      operationId: getProviderHealth
      tags: [Operations]
      responses:
        '200':
          description: Provider circuit breaker states and data freshness

  # TODO: Add routes from apps/api/src/routes/
